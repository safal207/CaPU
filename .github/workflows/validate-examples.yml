name: Validate Examples

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          set -euxo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate JSON examples against schemas
        run: |
          set -euxo pipefail
          npm run validate:examples

      - name: Validate lifecycle conformance fixtures
        run: |
          set -euxo pipefail
          npm run validate:conformance

      - name: Validate runtime HTTP OpenAPI-lite contract
        run: |
          set -euxo pipefail
          npm run validate:runtime-http-openapi-lite

      - name: Validate runtime HTTP error taxonomy
        run: |
          set -euxo pipefail
          npm run validate:runtime-http-error-taxonomy

      - name: Run reference runtime tests
        run: |
          set -euxo pipefail
          npm run test:reference

      - name: Verify golden fixture against runtime
        run: |
          set -euxo pipefail
          npm run verify:golden
