name: CaPU vCML Generation Wrap ABA v0.25

on:
  pull_request:
    paths:
      - 'rtl/capu_generation_wrap_aba_v25.sv'
      - 'rtl/tb/capu_generation_wrap_aba_v25_tb.sv'
      - 'tools/vcml_generation_wrap_checkpoint_v25.py'
      - 'tests/test_vcml_generation_wrap_checkpoint_v25.py'
      - 'formal/capu_generation_wrap_aba_v25*'
      - '.github/workflows/vcml-generation-wrap-aba-v25.yml'
      - 'docs/hardware/CAPU_VCML_GENERATION_WRAP_ABA_V25.md'

jobs:
  deterministic:
    name: Generation-wrap ABA deterministic trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.25
        run: iverilog -g2012 -o /tmp/capu-v25 rtl/capu_generation_wrap_aba_v25.sv rtl/tb/capu_generation_wrap_aba_v25_tb.sv
      - name: Run deterministic v0.25 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v25 | tee vcml-generation-wrap-v25.log
          grep -F 'CAPU_VCML_GENERATION_WRAP_ABA_V25_PASS' vcml-generation-wrap-v25.log
          grep -F 'historical_same_generation_delivery quarantined=1 old_incarnation=1 current_incarnation=2 no_authority_mutation=1' vcml-generation-wrap-v25.log
          grep -F 'historical_same_generation_ack quarantined=1 old_incarnation=1 current_incarnation=2 no_authority_mutation=1' vcml-generation-wrap-v25.log
          grep -F 'wrapped_generation_completed_only_from_incarnation_2_evidence=1 authority_reopened=1' vcml-generation-wrap-v25.log
      - name: Run canonical v0.25 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_generation_wrap_checkpoint_v25.py | tee vcml-generation-wrap-checkpoint-v25-python.log
          grep -F 'VCML_GENERATION_WRAP_CHECKPOINT_V25_PASS' vcml-generation-wrap-checkpoint-v25-python.log
          grep -F 'mixed_aba_authority_rejected=1' vcml-generation-wrap-checkpoint-v25-python.log
      - name: Regress v0.24 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v24 rtl/capu_cross_generation_reordering_v24.sv rtl/tb/capu_cross_generation_reordering_v24_tb.sv
          vvp /tmp/capu-v24 | tee vcml-cross-generation-v24-regression.log
          grep -F 'CAPU_VCML_CROSS_GENERATION_V24_PASS' vcml-cross-generation-v24-regression.log
          python3 tests/test_vcml_cross_generation_checkpoint_v24.py | tee vcml-cross-generation-checkpoint-v24-python-regression.log
          grep -F 'VCML_CROSS_GENERATION_CHECKPOINT_V24_PASS' vcml-cross-generation-checkpoint-v24-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_generation_wrap_aba_v25.sv rtl/tb/capu_generation_wrap_aba_v25_tb.sv tools/vcml_generation_wrap_checkpoint_v25.py tests/test_vcml_generation_wrap_checkpoint_v25.py vcml-generation-wrap-v25.log vcml-generation-wrap-checkpoint-v25-python.log vcml-cross-generation-v24-regression.log vcml-cross-generation-checkpoint-v24-python-regression.log > vcml-generation-wrap-v25.sha256
          cat vcml-generation-wrap-v25.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v25-generation-wrap-evidence
          path: |
            vcml-generation-wrap-v25.log
            vcml-generation-wrap-checkpoint-v25-python.log
            vcml-cross-generation-v24-regression.log
            vcml-cross-generation-checkpoint-v24-python-regression.log
            vcml-generation-wrap-v25.sha256

  formal:
    name: Bounded v0.25 generation-wrap ABA proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.25 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v25-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v25-formal/safety-work formal/capu_generation_wrap_aba_v25.sby 2>&1 | tee target/capu-v25-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v25-formal/formal.log
      - name: Prove v0.25 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v25-formal/cover-work formal/capu_generation_wrap_aba_v25_cover.sby 2>&1 | tee target/capu-v25-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v25-formal/cover.log
          test "$(find target/capu-v25-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.24 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v25-formal/v24-safety-work formal/capu_cross_generation_reordering_v24.sby 2>&1 | tee target/capu-v25-formal/v24-formal.log
          grep -q 'DONE (PASS' target/capu-v25-formal/v24-formal.log
      - name: Seal v0.25 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v25-formal')
          safety=(root/'formal.log').read_text(errors='replace');cover=(root/'cover.log').read_text(errors='replace');v24=(root/'v24-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_generation_wrap_aba_v25.sv','formal/capu_generation_wrap_aba_v25_formal.sv','formal/capu_generation_wrap_aba_v25.sby','formal/capu_generation_wrap_aba_v25_cover.sby','tools/vcml_generation_wrap_checkpoint_v25.py']]
          h=hashlib.sha256()
          for p in inputs:h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.generation-wrap-aba-formal-proof.v0.25','result':'PASS','depth':40,'cover_depth':52,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'v0_24_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_24_regression_log_sha256':hashlib.sha256(v24.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width generation wrap with incarnation-separated ABA authority; no incarnation wrap or unbounded transport'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n');print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v25-generation-wrap-formal-evidence
          path: |
            target/capu-v25-formal/formal.log
            target/capu-v25-formal/cover.log
            target/capu-v25-formal/v24-formal.log
            target/capu-v25-formal/formal-proof.json
            target/capu-v25-formal/safety-work/
            target/capu-v25-formal/cover-work/
