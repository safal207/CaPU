name: CaPU vCML Full Causal Checkpoint v0.14

on:
  pull_request:
    paths:
      - "rtl/capu_checkpoint_full_state_binding_v14.sv"
      - "rtl/tb/capu_checkpoint_full_state_binding_v14_tb.sv"
      - "formal/capu_checkpoint_full_state_binding_v14_formal.sv"
      - "formal/capu_checkpoint_full_state_binding_v14.sby"
      - "formal/capu_checkpoint_full_state_binding_v14_cover.sby"
      - "tools/vcml_causal_checkpoint_v14.py"
      - "tests/test_vcml_causal_checkpoint_v14.py"
      - "docs/hardware/CAPU_VCML_FULL_CAUSAL_CHECKPOINT_V14.md"
      - ".github/workflows/vcml-checkpoint-full-state-v14.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-state-rtl:
    name: Full causal checkpoint binding composition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.14 full causal checkpoint path
        run: |
          iverilog -g2012 -o /tmp/capu-vcml-checkpoint-v14 \
            rtl/capu_store_buffer.sv \
            rtl/capu_ctag_validator.sv \
            rtl/capu_seal_controller.sv \
            rtl/capu_causal_head_controller.sv \
            rtl/capu_vcml_store_buffer.sv \
            rtl/capu_replay_recovery_guard.sv \
            rtl/capu_vcml_store_buffer_v10.sv \
            rtl/capu_checkpoint_freshness_guard.sv \
            rtl/capu_vcml_store_buffer_v11.sv \
            rtl/capu_checkpoint_commit_controller.sv \
            rtl/capu_vcml_store_buffer_v12.sv \
            rtl/capu_checkpoint_content_binding_v13.sv \
            rtl/capu_checkpoint_full_state_binding_v14.sv \
            rtl/tb/capu_checkpoint_full_state_binding_v14_tb.sv
      - name: Run v0.14 full-state trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-vcml-checkpoint-v14 | tee vcml-checkpoint-full-state-v14.log
          grep -F "CAPU_VCML_CHECKPOINT_FULL_STATE_V14_PASS" vcml-checkpoint-full-state-v14.log
          grep -F "candidate_mismatch rejected=1" vcml-checkpoint-full-state-v14.log
          grep -F "persistence_causal_mismatch rejected=1 exact=1" vcml-checkpoint-full-state-v14.log
          grep -F "anchor_ack_causal_mismatch rejected=1 committed=1" vcml-checkpoint-full-state-v14.log
          grep -F "restored head=2201 gen=6 seal=0 spent=1" vcml-checkpoint-full-state-v14.log
          grep -F "recovery_mismatch rejected=1" vcml-checkpoint-full-state-v14.log
      - name: Run canonical full causal checkpoint SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_causal_checkpoint_v14.py | tee vcml-checkpoint-full-state-v14-python.log
          grep -F "VCML_CAUSAL_CHECKPOINT_V14_PASS" vcml-checkpoint-full-state-v14-python.log
          grep -F "head_change_digest_changed=1" vcml-checkpoint-full-state-v14-python.log
          grep -F "gen_change_digest_changed=1" vcml-checkpoint-full-state-v14-python.log
          grep -F "seal_change_digest_changed=1" vcml-checkpoint-full-state-v14-python.log
          grep -F "speculative_field_rejected=1" vcml-checkpoint-full-state-v14-python.log
      - name: Capture v0.14 executable evidence hashes
        run: |
          sha256sum \
            rtl/capu_checkpoint_full_state_binding_v14.sv \
            rtl/tb/capu_checkpoint_full_state_binding_v14_tb.sv \
            tools/vcml_causal_checkpoint_v14.py \
            tests/test_vcml_causal_checkpoint_v14.py \
            vcml-checkpoint-full-state-v14.log \
            vcml-checkpoint-full-state-v14-python.log > vcml-checkpoint-full-state-v14.sha256
          cat vcml-checkpoint-full-state-v14.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v14-full-causal-state-evidence
          path: |
            vcml-checkpoint-full-state-v14.log
            vcml-checkpoint-full-state-v14-python.log
            vcml-checkpoint-full-state-v14.sha256

  full-state-formal:
    name: Bounded v0.14 full causal checkpoint proof
    needs: full-state-rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove v0.14 bounded full-state safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-vcml-checkpoint-full-state-formal
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-checkpoint-full-state-formal/safety-work \
            formal/capu_checkpoint_full_state_binding_v14.sby 2>&1 | tee target/capu-vcml-checkpoint-full-state-formal/formal.log
          grep -q 'DONE (PASS' target/capu-vcml-checkpoint-full-state-formal/formal.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-checkpoint-full-state-formal/formal.log
      - name: Prove full-state success and mismatch paths are reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-checkpoint-full-state-formal/cover-work \
            formal/capu_checkpoint_full_state_binding_v14_cover.sby 2>&1 | tee target/capu-vcml-checkpoint-full-state-formal/cover.log
          grep -q 'DONE (PASS' target/capu-vcml-checkpoint-full-state-formal/cover.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-checkpoint-full-state-formal/cover.log
      - name: Seal v0.14 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('target/capu-vcml-checkpoint-full-state-formal')
          safety = (root/'formal.log').read_text(errors='replace')
          cover = (root/'cover.log').read_text(errors='replace')
          if 'DONE (PASS' not in safety or 'DONE (ERROR' in safety:
              raise SystemExit('v0.14 safety not PASS')
          if 'DONE (PASS' not in cover or 'DONE (ERROR' in cover:
              raise SystemExit('v0.14 cover not PASS')
          inputs = [Path(x) for x in [
              'rtl/capu_checkpoint_full_state_binding_v14.sv',
              'formal/capu_checkpoint_full_state_binding_v14_formal.sv',
              'formal/capu_checkpoint_full_state_binding_v14.sby',
              'formal/capu_checkpoint_full_state_binding_v14_cover.sby']]
          h = hashlib.sha256()
          for p in inputs:
              h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof = {
              'schema':'capu.hardware.full-causal-checkpoint-formal-proof.v0.14',
              'result':'PASS',
              'depth':16,
              'cover_depth':20,
              'solver':'z3',
              'formal_instance':{
                  'authorization_ref_width':4,
                  'spent_authorization_slots':2,
                  'checkpoint_ref_width':3,
                  'checkpoint_epoch_width':3,
                  'checkpoint_commitment_width':4,
                  'transition_id_width':4},
              'binding_policy':'checkpoint prepare captures the explicit committed causal state; persistence and anchor acknowledgement preserve head/GEN/SEAL exactly; anchored recovery requires both the v0.13 commitment verdict and exact explicit causal-state equality with the authoritative anchor',
              'invariants':[
                  'PREPARE_ACCEPT => CANDIDATE_CAUSAL_STATE == COMMITTED_CAUSAL_STATE',
                  'PERSIST_ACCEPT => PERSISTED_CAUSAL_STATE == REQUEST_CAUSAL_STATE',
                  'CHECKPOINT_COMMIT_EVENT => ACK_CAUSAL_STATE == REQUEST_CAUSAL_STATE',
                  'ANCHORED_RESTORE_ACCEPT => SNAPSHOT_CAUSAL_STATE == ANCHOR_CAUSAL_STATE',
                  'CAUSAL_STATE_MISMATCH => NO_RESTORE_ACCEPT',
                  'RECOVERED_STATE_READY_AFTER_ACCEPT => RECOVERED_CAUSAL_STATE == ACCEPTED_SNAPSHOT_CAUSAL_STATE'],
              'claim_boundary':'The proof covers explicit committed causal checkpoint state (head_valid, transition_id, 4-bit GEN, SEAL) plus the existing finite replay-state restore path in a reduced-width bounded composition. SHA-256 and commitment verification remain trusted off-path functions. The recovered causal record is not yet wired back into the live v0.9 continuation controller after reset; no complete CPU architectural state, durable-media correctness, trusted-engine integrity, cryptographic RTL implementation correctness or unbounded/parametric proof is claimed.',
              'formal_input_sha256':h.hexdigest(),
              'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),
              'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),
              'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),
              'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),
              'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),
          }
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Upload v0.14 formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v14-full-causal-state-formal-evidence
          path: |
            target/capu-vcml-checkpoint-full-state-formal/formal.log
            target/capu-vcml-checkpoint-full-state-formal/cover.log
            target/capu-vcml-checkpoint-full-state-formal/formal-proof.json
            target/capu-vcml-checkpoint-full-state-formal/safety-work/
            target/capu-vcml-checkpoint-full-state-formal/cover-work/
          if-no-files-found: warn
