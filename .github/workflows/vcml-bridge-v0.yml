name: CaPU vCML Bridge v0

on:
  pull_request:
    paths:
      - "rtl/capu_store_buffer.sv"
      - "rtl/capu_ctag_validator.sv"
      - "rtl/capu_seal_controller.sv"
      - "rtl/capu_causal_head_controller.sv"
      - "rtl/capu_vcml_store_buffer.sv"
      - "rtl/tb/capu_vcml_store_buffer_tb.sv"
      - "formal/capu_vcml_store_buffer.sby"
      - "formal/capu_vcml_store_buffer_cover.sby"
      - "formal/capu_vcml_store_buffer_formal.sv"
      - "tools/vcml_bridge.py"
      - "tests/test_vcml_bridge.py"
      - "docs/hardware/CAPU_VCML_BRIDGE_V0.md"
      - ".github/workflows/vcml-bridge-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-and-semantic-bridge:
    name: CTAG + SEAL + parent + GEN + auth provenance + vCML projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.8 causal STORE bridge
        run: |
          iverilog -g2012 -o /tmp/capu-vcml-bridge \
            rtl/capu_store_buffer.sv \
            rtl/capu_ctag_validator.sv \
            rtl/capu_seal_controller.sv \
            rtl/capu_causal_head_controller.sv \
            rtl/capu_vcml_store_buffer.sv \
            rtl/tb/capu_vcml_store_buffer_tb.sv
      - name: Run RTL invariant smoke
        run: |
          set -o pipefail
          vvp /tmp/capu-vcml-bridge | tee vcml-rtl.log
          grep -F "CAPU_VCML_BRIDGE_V08_RTL_PASS" vcml-rtl.log
          grep -F "unauthorized_root rejected=1" vcml-rtl.log
          grep -F "zero_auth_ref rejected=1" vcml-rtl.log
          grep -F "authorized_root_committed head=10 auth_ref=A110 policy_epoch=07" vcml-rtl.log
          grep -F "continuation_spurious_auth ignored=1 gen=1" vcml-rtl.log
          grep -F "zero_ref_root_under_seal rejected=1" vcml-rtl.log
          grep -F "authorized_root_flush no_event=1 provenance_preserved=1" vcml-rtl.log
          grep -F "epoch_exhausted head_gen=F" vcml-rtl.log
          grep -F "exhausted_zero_ref_root rejected=1" vcml-rtl.log
          grep -F "exhausted_root_committed head=62 auth_ref=A162 policy_epoch=0C" vcml-rtl.log
      - name: Run software bridge tests
        run: |
          python3 -m py_compile tools/vcml_bridge.py
          python3 tests/test_vcml_bridge.py | tee vcml-python.log
      - name: Capture evidence hashes
        run: |
          sha256sum rtl/capu_ctag_validator.sv rtl/capu_seal_controller.sv \
            rtl/capu_causal_head_controller.sv rtl/capu_vcml_store_buffer.sv \
            rtl/tb/capu_vcml_store_buffer_tb.sv formal/capu_vcml_store_buffer_formal.sv \
            vcml-rtl.log tools/vcml_bridge.py tests/test_vcml_bridge.py > vcml-evidence.sha256
          cat vcml-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-bridge-v08-evidence
          path: |
            vcml-rtl.log
            vcml-python.log
            vcml-evidence.sha256

  formal-causal-abi:
    name: Bounded v0.8 root provenance + causal ABI proof
    needs: rtl-and-semantic-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove v0.8 bounded safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-vcml-formal
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-formal/safety-work \
            formal/capu_vcml_store_buffer.sby 2>&1 | tee target/capu-vcml-formal/formal.log
          grep -q 'DONE (PASS' target/capu-vcml-formal/formal.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-formal/formal.log
      - name: Prove root provenance and continuation paths are reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-formal/cover-work \
            formal/capu_vcml_store_buffer_cover.sby 2>&1 | tee target/capu-vcml-formal/cover.log
          grep -q 'DONE (PASS' target/capu-vcml-formal/cover.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-formal/cover.log
      - name: Seal v0.8 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('target/capu-vcml-formal')
          safety = (root/'formal.log').read_text(errors='replace')
          cover = (root/'cover.log').read_text(errors='replace')
          if 'DONE (PASS' not in safety or 'DONE (ERROR' in safety: raise SystemExit('safety not PASS')
          if 'DONE (PASS' not in cover or 'DONE (ERROR' in cover: raise SystemExit('cover not PASS')
          inputs = [Path(x) for x in [
            'rtl/capu_store_buffer.sv','rtl/capu_ctag_validator.sv','rtl/capu_seal_controller.sv',
            'rtl/capu_causal_head_controller.sv','rtl/capu_vcml_store_buffer.sv',
            'formal/capu_vcml_store_buffer_formal.sv','formal/capu_vcml_store_buffer.sby',
            'formal/capu_vcml_store_buffer_cover.sby']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={
            'schema':'capu.hardware.vcml-formal-proof.v0.8','result':'PASS',
            'depth':36,'cover_depth':40,'solver':'z3',
            'formal_instance':{
              'addr_width':4,'data_width':8,'ctag_width':16,
              'transition_id_width':8,'parent_ref_width':8,'gen_width':4,
              'root_authorization_width':1,'authorization_ref_width':4,'policy_epoch_width':4},
            'root_policy':'explicit_new_cause requires trusted root_authorized, non-zero root_authorization_ref, parent_ref==0 and GEN==0; root_policy_epoch is bound but opaque',
            'generation_policy':'normal continuation requires GEN==committed_GEN+1; committed GEN==F blocks automatic continuation and forbids F->0 wrap',
            'invariants':[
              'MEMORY_VISIBLE_WRITE => VALID_CAUSAL_COMMIT && VALIDATOR_ACCEPTED_CTAG',
              'NORMAL_CONTINUATION_ADMISSION => HEAD_VALID && !SEALED_CHAIN && !GEN_EXHAUSTED && PARENT_REF==COMMITTED_HEAD && GEN==COMMITTED_GEN+1',
              'EXPLICIT_NEW_CAUSE_ADMISSION => ROOT_AUTHORIZED && AUTHORIZATION_REF!=0 && PARENT_REF==0 && GEN==0',
              'UNAUTHORIZED_OR_ZERO_REF_EXPLICIT_ROOT => NO_ROOT_ADMISSION',
              'VISIBLE_ROOT_COMMIT => RETIRED_ROOT_AUTHORIZED && RETIRED_AUTHORIZATION_REF!=0',
              'VISIBLE_WRITE preserves CTAG/transition_id/parent_ref/root-authorization/ref/policy-epoch binding',
              'CONTINUATION_RETIREMENT => NO_ROOT_AUTHORIZATION_PROVENANCE',
              'SEALED_CHAIN && !EXPLICIT_NEW_CAUSE => NO_AUTOMATIC_CHILD_ADMISSION',
              'GEN_EXHAUSTED && !EXPLICIT_NEW_CAUSE => NO_AUTOMATIC_CHILD_ADMISSION',
              'FLUSH => NO_RETIREMENT_EVENT && COMMITTED_HEAD_GEN_SEAL_AND_LAST_AUTH_PROVENANCE_UNCHANGED'],
            'claim_boundary':'Bounded reduced-width proof. root_authorized is a trusted upstream decision; root_authorization_ref is an opaque provenance/capability reference and root_policy_epoch is an opaque policy-version field. Neither is cryptographically authenticated or freshness-checked. No signature, principal identity, nonce, capability validity, persistent/global replay protection, cryptographic lineage, persistent head/GEN/seal state, or complete CPU proof is claimed.',
            'formal_input_sha256':h.hexdigest(),
            'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),
            'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),
            'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),
            'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),
            'z3_version':subprocess.check_output(['z3','--version'],text=True).strip()}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Upload v0.8 formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v08-formal-evidence
          path: |
            target/capu-vcml-formal/formal.log
            target/capu-vcml-formal/cover.log
            target/capu-vcml-formal/formal-proof.json
            target/capu-vcml-formal/safety-work/
            target/capu-vcml-formal/cover-work/
          if-no-files-found: warn
