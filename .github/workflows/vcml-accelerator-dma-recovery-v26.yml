name: CaPU vCML Accelerator DMA Recovery v0.26

on:
  pull_request:
    paths:
      - 'rtl/capu_accelerator_dma_recovery_v26.sv'
      - 'rtl/tb/capu_accelerator_dma_recovery_v26_tb.sv'
      - 'tools/vcml_accelerator_dma_checkpoint_v26.py'
      - 'tests/test_vcml_accelerator_dma_checkpoint_v26.py'
      - 'formal/capu_accelerator_dma_recovery_v26*'
      - '.github/workflows/vcml-accelerator-dma-recovery-v26.yml'
      - 'docs/hardware/CAPU_VCML_ACCELERATOR_DMA_RECOVERY_V26.md'

jobs:
  deterministic:
    name: Accelerator DMA recovery deterministic trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.26
        run: iverilog -g2012 -o /tmp/capu-v26 rtl/capu_accelerator_dma_recovery_v26.sv rtl/tb/capu_accelerator_dma_recovery_v26_tb.sv
      - name: Run deterministic v0.26 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v26 | tee vcml-accelerator-dma-v26.log
          grep -F 'CAPU_VCML_ACCELERATOR_DMA_RECOVERY_V26_PASS' vcml-accelerator-dma-v26.log
          grep -F 'stale_checkpoint_restore accepted=1 reconcile_required=1 checkpoint_effect_spent=0 durable_receipt=1' vcml-accelerator-dma-v26.log
          grep -F 'post_restore_dma_replay rejected=1 receipt_conflict_blocks_authority=1' vcml-accelerator-dma-v26.log
          grep -F 'post_reconcile_dma_replay rejected=1 spent_effect_cannot_reexecute=1' vcml-accelerator-dma-v26.log
          grep -F 'command_retire accepted=1 exactly_once_dma_effect=1' vcml-accelerator-dma-v26.log
      - name: Run canonical v0.26 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_accelerator_dma_checkpoint_v26.py | tee vcml-accelerator-dma-checkpoint-v26-python.log
          grep -F 'VCML_ACCELERATOR_DMA_CHECKPOINT_V26_PASS' vcml-accelerator-dma-checkpoint-v26-python.log
          grep -F 'mixed_dma_receipt_authority_rejected=1' vcml-accelerator-dma-checkpoint-v26-python.log
          grep -F 'stale_checkpoint_without_receipt_rejected=1' vcml-accelerator-dma-checkpoint-v26-python.log
      - name: Regress v0.25 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v25 rtl/capu_generation_wrap_aba_v25.sv rtl/tb/capu_generation_wrap_aba_v25_tb.sv
          vvp /tmp/capu-v25 | tee vcml-generation-wrap-v25-regression.log
          grep -F 'CAPU_VCML_GENERATION_WRAP_ABA_V25_PASS' vcml-generation-wrap-v25-regression.log
          python3 tests/test_vcml_generation_wrap_checkpoint_v25.py | tee vcml-generation-wrap-checkpoint-v25-python-regression.log
          grep -F 'VCML_GENERATION_WRAP_CHECKPOINT_V25_PASS' vcml-generation-wrap-checkpoint-v25-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_accelerator_dma_recovery_v26.sv rtl/tb/capu_accelerator_dma_recovery_v26_tb.sv tools/vcml_accelerator_dma_checkpoint_v26.py tests/test_vcml_accelerator_dma_checkpoint_v26.py vcml-accelerator-dma-v26.log vcml-accelerator-dma-checkpoint-v26-python.log vcml-generation-wrap-v25-regression.log vcml-generation-wrap-checkpoint-v25-python-regression.log > vcml-accelerator-dma-v26.sha256
          cat vcml-accelerator-dma-v26.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v26-accelerator-dma-evidence
          path: |
            vcml-accelerator-dma-v26.log
            vcml-accelerator-dma-checkpoint-v26-python.log
            vcml-generation-wrap-v25-regression.log
            vcml-generation-wrap-checkpoint-v25-python-regression.log
            vcml-accelerator-dma-v26.sha256

  formal:
    name: Bounded v0.26 accelerator DMA recovery proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.26 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v26-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v26-formal/safety-work formal/capu_accelerator_dma_recovery_v26.sby 2>&1 | tee target/capu-v26-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v26-formal/formal.log
      - name: Prove v0.26 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v26-formal/cover-work formal/capu_accelerator_dma_recovery_v26_cover.sby 2>&1 | tee target/capu-v26-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v26-formal/cover.log
          test "$(find target/capu-v26-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.25 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v26-formal/v25-safety-work formal/capu_generation_wrap_aba_v25.sby 2>&1 | tee target/capu-v26-formal/v25-formal.log
          grep -q 'DONE (PASS' target/capu-v26-formal/v25-formal.log
      - name: Seal v0.26 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v26-formal')
          safety=(root/'formal.log').read_text(errors='replace');cover=(root/'cover.log').read_text(errors='replace');v25=(root/'v25-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_accelerator_dma_recovery_v26.sv','formal/capu_accelerator_dma_recovery_v26_formal.sv','formal/capu_accelerator_dma_recovery_v26.sby','formal/capu_accelerator_dma_recovery_v26_cover.sby','tools/vcml_accelerator_dma_checkpoint_v26.py']]
          h=hashlib.sha256()
          for p in inputs:h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.accelerator-dma-recovery-formal-proof.v0.26','result':'PASS','depth':42,'cover_depth':56,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'v0_25_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_25_regression_log_sha256':hashlib.sha256(v25.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded one-command one-DMA-effect recovery authority with durable receipt reconciliation; no asynchronous in-flight ambiguity or production DMA fabric'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n');print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v26-accelerator-dma-formal-evidence
          path: |
            target/capu-v26-formal/formal.log
            target/capu-v26-formal/cover.log
            target/capu-v26-formal/v25-formal.log
            target/capu-v26-formal/formal-proof.json
            target/capu-v26-formal/safety-work/
            target/capu-v26-formal/cover-work/
