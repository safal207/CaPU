name: CaPU vCML TLB Shootdown Authority v0.21

on:
  pull_request:
    paths:
      - "rtl/capu_tlb_shootdown_authority_v21.sv"
      - "rtl/tb/capu_tlb_shootdown_authority_v21_tb.sv"
      - "formal/capu_tlb_shootdown_authority_v21_formal.sv"
      - "formal/capu_tlb_shootdown_authority_v21.sby"
      - "formal/capu_tlb_shootdown_authority_v21_cover.sby"
      - "tools/vcml_tlb_checkpoint_v21.py"
      - "tests/test_vcml_tlb_checkpoint_v21.py"
      - "docs/hardware/CAPU_VCML_TLB_SHOOTDOWN_AUTHORITY_V21.md"
      - ".github/workflows/vcml-tlb-shootdown-v21.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlb-rtl:
    name: Exact TLB freshness trajectory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.21
        run: |
          iverilog -g2012 -o /tmp/capu-v21 rtl/capu_tlb_shootdown_authority_v21.sv rtl/tb/capu_tlb_shootdown_authority_v21_tb.sv
      - name: Run deterministic v0.21 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v21 | tee vcml-tlb-shootdown-v21.log
          grep -F "CAPU_VCML_TLB_SHOOTDOWN_V21_PASS" vcml-tlb-shootdown-v21.log
          grep -F "fresh_tlb_hit exact=1" vcml-tlb-shootdown-v21.log
          grep -F "stale_epoch rejected=1" vcml-tlb-shootdown-v21.log
          grep -F "foreign_shootdown_ack rejected=1" vcml-tlb-shootdown-v21.log
          grep -F "exact_shootdown_ack accepted=1" vcml-tlb-shootdown-v21.log
          grep -F "recovery old_tlb_authority_destroyed=1" vcml-tlb-shootdown-v21.log
      - name: Run canonical v0.21 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_tlb_checkpoint_v21.py | tee vcml-tlb-checkpoint-v21-python.log
          grep -F "VCML_TLB_CHECKPOINT_V21_PASS" vcml-tlb-checkpoint-v21-python.log
          grep -F "tlb_epoch_change_digest_changed=1" vcml-tlb-checkpoint-v21-python.log
          grep -F "shootdown_authority_change_digest_changed=1" vcml-tlb-checkpoint-v21-python.log
          grep -F "mixed_tlb_authority_rejected=1" vcml-tlb-checkpoint-v21-python.log
      - name: Regress v0.20 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v20 rtl/capu_mmu_translation_recovery_v20.sv rtl/tb/capu_mmu_translation_recovery_v20_tb.sv
          vvp /tmp/capu-v20 | tee vcml-mmu-translation-v20-regression.log
          grep -F "CAPU_VCML_MMU_TRANSLATION_V20_PASS" vcml-mmu-translation-v20-regression.log
          python3 tests/test_vcml_mmu_checkpoint_v20.py | tee vcml-mmu-checkpoint-v20-python-regression.log
          grep -F "VCML_MMU_CHECKPOINT_V20_PASS" vcml-mmu-checkpoint-v20-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_tlb_shootdown_authority_v21.sv rtl/tb/capu_tlb_shootdown_authority_v21_tb.sv tools/vcml_tlb_checkpoint_v21.py tests/test_vcml_tlb_checkpoint_v21.py vcml-tlb-shootdown-v21.log vcml-tlb-checkpoint-v21-python.log vcml-mmu-translation-v20-regression.log vcml-mmu-checkpoint-v20-python-regression.log > vcml-tlb-shootdown-v21.sha256
          cat vcml-tlb-shootdown-v21.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v21-tlb-shootdown-evidence
          path: |
            vcml-tlb-shootdown-v21.log
            vcml-tlb-checkpoint-v21-python.log
            vcml-mmu-translation-v20-regression.log
            vcml-mmu-checkpoint-v20-python-regression.log
            vcml-tlb-shootdown-v21.sha256

  tlb-formal:
    name: Bounded v0.21 TLB shootdown proof
    needs: tlb-rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.21 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v21-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v21-formal/safety-work formal/capu_tlb_shootdown_authority_v21.sby 2>&1 | tee target/capu-v21-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v21-formal/formal.log
          ! grep -q 'DONE (ERROR' target/capu-v21-formal/formal.log
      - name: Prove v0.21 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v21-formal/cover-work formal/capu_tlb_shootdown_authority_v21_cover.sby 2>&1 | tee target/capu-v21-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v21-formal/cover.log
          ! grep -q 'DONE (ERROR' target/capu-v21-formal/cover.log
          test "$(find target/capu-v21-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.20 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v21-formal/v20-safety-work formal/capu_mmu_translation_recovery_v20.sby 2>&1 | tee target/capu-v21-formal/v20-formal.log
          grep -q 'DONE (PASS' target/capu-v21-formal/v20-formal.log
          ! grep -q 'DONE (ERROR' target/capu-v21-formal/v20-formal.log
      - name: Seal v0.21 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v21-formal')
          safety=(root/'formal.log').read_text(errors='replace');cover=(root/'cover.log').read_text(errors='replace');v20=(root/'v20-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_tlb_shootdown_authority_v21.sv','formal/capu_tlb_shootdown_authority_v21_formal.sv','formal/capu_tlb_shootdown_authority_v21.sby','formal/capu_tlb_shootdown_authority_v21_cover.sby','tools/vcml_tlb_checkpoint_v21.py']]
          h=hashlib.sha256()
          for p in inputs:h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.tlb-shootdown-authority-formal-proof.v0.21','result':'PASS','depth':32,'cover_depth':38,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'v0_20_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_20_regression_log_sha256':hashlib.sha256(v20.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width one-entry TLB plus one shootdown transaction; no production multi-entry TLB, multi-hart shootdown, page-walker, virtualization, coherence or unbounded correctness'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n');print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v21-tlb-shootdown-formal-evidence
          path: |
            target/capu-v21-formal/formal.log
            target/capu-v21-formal/cover.log
            target/capu-v21-formal/v20-formal.log
            target/capu-v21-formal/formal-proof.json
            target/capu-v21-formal/safety-work/
            target/capu-v21-formal/cover-work/
          if-no-files-found: warn
