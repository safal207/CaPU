name: CaPU vCML DMA Completion Uncertainty v0.27

on:
  pull_request:
    paths:
      - 'rtl/capu_dma_completion_uncertainty_v27.sv'
      - 'rtl/tb/capu_dma_completion_uncertainty_v27_tb.sv'
      - 'tools/vcml_dma_completion_checkpoint_v27.py'
      - 'tests/test_vcml_dma_completion_checkpoint_v27.py'
      - 'formal/capu_dma_completion_uncertainty_v27*'
      - '.github/workflows/vcml-dma-completion-uncertainty-v27.yml'
      - 'docs/hardware/CAPU_VCML_DMA_COMPLETION_UNCERTAINTY_V27.md'

jobs:
  deterministic:
    name: DMA completion uncertainty deterministic trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.27
        run: iverilog -g2012 -o /tmp/capu-v27 rtl/capu_dma_completion_uncertainty_v27.sv rtl/tb/capu_dma_completion_uncertainty_v27_tb.sv
      - name: Run deterministic v0.27 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v27 | tee vcml-dma-completion-v27.log
          grep -F 'CAPU_VCML_DMA_COMPLETION_UNCERTAINTY_V27_PASS' vcml-dma-completion-v27.log
          grep -F 'stale_checkpoint_restore accepted=1 completion=UNKNOWN evidence_required=1 replay_authority=0 retire_authority=0' vcml-dma-completion-v27.log
          grep -F 'exact_evidence_not_committed accepted=1 replay_authority_reopened=1' vcml-dma-completion-v27.log
          grep -F 'exact_evidence_committed accepted=1 durable_completion_receipt=1 effect_spent=1 replay_authority=0' vcml-dma-completion-v27.log
          grep -F 'late_stale_checkpoint_restore completion_receipt_wins=1 completion=COMMITTED replay_authority=0' vcml-dma-completion-v27.log
      - name: Run canonical v0.27 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_dma_completion_checkpoint_v27.py | tee vcml-dma-completion-checkpoint-v27-python.log
          grep -F 'VCML_DMA_COMPLETION_CHECKPOINT_V27_PASS' vcml-dma-completion-checkpoint-v27-python.log
          grep -F 'unknown_to_replayable_mixed_state_rejected=1' vcml-dma-completion-checkpoint-v27-python.log
          grep -F 'foreign_completion_receipt_mixed_state_rejected=1' vcml-dma-completion-checkpoint-v27-python.log
      - name: Regress v0.26 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v26 rtl/capu_accelerator_dma_recovery_v26.sv rtl/tb/capu_accelerator_dma_recovery_v26_tb.sv
          vvp /tmp/capu-v26 | tee vcml-accelerator-dma-v26-regression.log
          grep -F 'CAPU_VCML_ACCELERATOR_DMA_RECOVERY_V26_PASS' vcml-accelerator-dma-v26-regression.log
          python3 tests/test_vcml_accelerator_dma_checkpoint_v26.py | tee vcml-accelerator-dma-checkpoint-v26-python-regression.log
          grep -F 'VCML_ACCELERATOR_DMA_CHECKPOINT_V26_PASS' vcml-accelerator-dma-checkpoint-v26-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_dma_completion_uncertainty_v27.sv rtl/tb/capu_dma_completion_uncertainty_v27_tb.sv tools/vcml_dma_completion_checkpoint_v27.py tests/test_vcml_dma_completion_checkpoint_v27.py vcml-dma-completion-v27.log vcml-dma-completion-checkpoint-v27-python.log vcml-accelerator-dma-v26-regression.log vcml-accelerator-dma-checkpoint-v26-python-regression.log > vcml-dma-completion-v27.sha256
          cat vcml-dma-completion-v27.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v27-dma-completion-evidence
          path: |
            vcml-dma-completion-v27.log
            vcml-dma-completion-checkpoint-v27-python.log
            vcml-accelerator-dma-v26-regression.log
            vcml-accelerator-dma-checkpoint-v26-python-regression.log
            vcml-dma-completion-v27.sha256

  formal:
    name: Bounded v0.27 DMA completion uncertainty proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.27 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v27-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v27-formal/safety-work formal/capu_dma_completion_uncertainty_v27.sby 2>&1 | tee target/capu-v27-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v27-formal/formal.log
      - name: Prove v0.27 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v27-formal/cover-work formal/capu_dma_completion_uncertainty_v27_cover.sby 2>&1 | tee target/capu-v27-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v27-formal/cover.log
          test "$(find target/capu-v27-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.26 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v27-formal/v26-safety-work formal/capu_accelerator_dma_recovery_v26.sby 2>&1 | tee target/capu-v27-formal/v26-formal.log
          grep -q 'DONE (PASS' target/capu-v27-formal/v26-formal.log
      - name: Seal v0.27 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v27-formal')
          safety=(root/'formal.log').read_text(errors='replace');cover=(root/'cover.log').read_text(errors='replace');v26=(root/'v26-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_dma_completion_uncertainty_v27.sv','formal/capu_dma_completion_uncertainty_v27_formal.sv','formal/capu_dma_completion_uncertainty_v27.sby','formal/capu_dma_completion_uncertainty_v27_cover.sby','tools/vcml_dma_completion_checkpoint_v27.py']]
          h=hashlib.sha256()
          for p in inputs:h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.dma-completion-uncertainty-formal-proof.v0.27','result':'PASS','depth':16,'cover_depth':24,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'formal_identity_width_bits':2,'v0_26_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_26_regression_log_sha256':hashlib.sha256(v26.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width one-command one-DMA-effect tri-state completion uncertainty with modeled durable issue/completion evidence; no production transport or partial-write semantics'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n');print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v27-dma-completion-formal-evidence
          path: |
            target/capu-v27-formal/formal.log
            target/capu-v27-formal/cover.log
            target/capu-v27-formal/v26-formal.log
            target/capu-v27-formal/formal-proof.json
            target/capu-v27-formal/safety-work/
            target/capu-v27-formal/cover-work/
