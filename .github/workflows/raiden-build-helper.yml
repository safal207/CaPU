name: Raiden Build Mirror and Helper Worker

on:
  push:
    paths:
      - ".github/workflows/raiden-build-helper.yml"
  pull_request:
    paths:
      - ".github/workflows/raiden-build-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper-worker:
    name: Mirror graph and prewarm heavy Raiden dependency
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      RAIDEN_UPSTREAM_REPO: https://github.com/google/tpu-raiden.git
      RAIDEN_UPSTREAM_SHA: 050d32bc7173d6413d32a8152118d0bad44c034d
      RAIDEN_BAZEL_VERSION: 8.6.0
      RAIDEN_BAZEL_TARGET: //tpu_raiden/api/jax:kv_cache_store_recovery_e2e_test
      RAIDEN_PREWARM_TARGET: //tpu_raiden/frameworks/jax:_raw_transfer
      RAIDEN_BAZEL_DISK_CACHE: ${{ github.workspace }}/.bazel-disk-cache
      RAIDEN_EVIDENCE_DIR: ${{ github.workspace }}/evidence/raiden-build-helper

    steps:
      - name: Checkout CaPU
        uses: actions/checkout@v4

      - name: Install pinned Bazel
        run: |
          set -euo pipefail
          url="https://github.com/bazelbuild/bazel/releases/download/${RAIDEN_BAZEL_VERSION}/bazel-${RAIDEN_BAZEL_VERSION}-linux-x86_64"
          curl --fail --location --retry 3 "$url" --output /tmp/bazel
          chmod +x /tmp/bazel
          sudo install /tmp/bazel /usr/local/bin/bazel
          test "$(bazel --version)" = "bazel ${RAIDEN_BAZEL_VERSION}"

      - name: Checkout pinned upstream Raiden
        run: |
          set -euo pipefail
          git init upstream-raiden
          git -C upstream-raiden remote add origin "$RAIDEN_UPSTREAM_REPO"
          git -C upstream-raiden fetch --depth=1 origin "$RAIDEN_UPSTREAM_SHA"
          git -C upstream-raiden checkout --detach FETCH_HEAD
          test "$(git -C upstream-raiden rev-parse HEAD)" = "$RAIDEN_UPSTREAM_SHA"
          test "$(cat upstream-raiden/.bazelversion)" = "$RAIDEN_BAZEL_VERSION"

      - name: Restore shared Bazel disk cache
        id: raiden-helper-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.bazel-disk-cache
          key: raiden-bazel-${{ runner.os }}-8.6.0-050d32bc7173d6413d32a8152118d0bad44c034d-helper-${{ github.run_id }}
          restore-keys: |
            raiden-bazel-${{ runner.os }}-8.6.0-050d32bc7173d6413d32a8152118d0bad44c034d-

      - name: FAST instruction - configured dependency map
        working-directory: upstream-raiden
        run: |
          set -euo pipefail
          mkdir -p "$RAIDEN_EVIDENCE_DIR"
          bazel cquery --config=oss "deps(${RAIDEN_BAZEL_TARGET})" --output=label \
            > "$RAIDEN_EVIDENCE_DIR/dependency-map.txt"
          total="$(wc -l < "$RAIDEN_EVIDENCE_DIR/dependency-map.txt" | tr -d ' ')"
          printf '{\n  "schema": "capu.raiden.assembly-plan.v0",\n  "upstream_sha": "%s",\n  "full_target": "%s",\n  "prewarm_target": "%s",\n  "configured_dependency_labels": %s,\n  "phases": ["FAST", "EASY", "OPTIMAL", "COMPLEX"],\n  "mirror": ["dependency-map", "bazel-profile", "prewarm-log", "cache-size"],\n  "friend_worker": "prewarm-heavy-native-dependency"\n}\n' \
            "$RAIDEN_UPSTREAM_SHA" "$RAIDEN_BAZEL_TARGET" "$RAIDEN_PREWARM_TARGET" "$total" \
            > "$RAIDEN_EVIDENCE_DIR/assembly-plan.json"

      - name: OPTIMAL instruction - helper prewarms native JAX dependency
        working-directory: upstream-raiden
        run: |
          mkdir -p "$RAIDEN_EVIDENCE_DIR" "$RAIDEN_BAZEL_DISK_CACHE"
          set +e
          timeout --signal=TERM --kill-after=30s 45m \
            bazel build --config=oss "$RAIDEN_PREWARM_TARGET" \
              --disk_cache="$RAIDEN_BAZEL_DISK_CACHE" \
              --experimental_disk_cache_gc_max_size=6G \
              --profile="$RAIDEN_EVIDENCE_DIR/prewarm-profile.gz" \
            2>&1 | tee "$RAIDEN_EVIDENCE_DIR/prewarm.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "RAIDEN_HELPER_EXIT_CODE=$code" >> "$GITHUB_ENV"
          echo "helper_exit_code=$code"
          du -sh "$RAIDEN_BAZEL_DISK_CACHE" | tee "$RAIDEN_EVIDENCE_DIR/cache-size.txt" || true

      - name: MIRROR - analyze helper profile
        if: always()
        working-directory: upstream-raiden
        run: |
          set +e
          if [ -s "$RAIDEN_EVIDENCE_DIR/prewarm-profile.gz" ]; then
            bazel analyze-profile "$RAIDEN_EVIDENCE_DIR/prewarm-profile.gz" \
              > "$RAIDEN_EVIDENCE_DIR/prewarm-profile.txt" 2>&1
          else
            echo "No profile produced." > "$RAIDEN_EVIDENCE_DIR/prewarm-profile.txt"
          fi
          exit 0

      - name: Save helper Bazel disk cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.bazel-disk-cache
          key: ${{ steps.raiden-helper-cache-restore.outputs.cache-primary-key }}

      - name: Upload mirror and helper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raiden-build-helper-evidence
          path: evidence/raiden-build-helper/
          if-no-files-found: error

      - name: Enforce helper result
        if: always()
        run: |
          code="${RAIDEN_HELPER_EXIT_CODE:-1}"
          if [ "$code" -eq 0 ]; then
            echo "Helper fully prewarmed ${RAIDEN_PREWARM_TARGET}."
            exit 0
          fi
          if [ "$code" -eq 124 ]; then
            echo "Helper reached its 45-minute seed budget; partial cache was preserved."
            exit 0
          fi
          echo "Helper failed with Bazel exit code: $code"
          exit "$code"
