name: CaPU vCML Delegated Nested Trap Authority v0.19

on:
  pull_request:
    paths:
      - "rtl/capu_delegated_nested_trap_v19.sv"
      - "rtl/tb/capu_delegated_nested_trap_v19_tb.sv"
      - "formal/capu_delegated_nested_trap_v19_formal.sv"
      - "formal/capu_delegated_nested_trap_v19.sby"
      - "formal/capu_delegated_nested_trap_v19_cover.sby"
      - "tools/vcml_nested_trap_checkpoint_v19.py"
      - "tests/test_vcml_nested_trap_checkpoint_v19.py"
      - "docs/hardware/CAPU_VCML_DELEGATED_NESTED_TRAP_V19.md"
      - ".github/workflows/vcml-delegated-nested-trap-v19.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegated-nested-rtl:
    name: Delegated nested trap trajectory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.19
        run: |
          iverilog -g2012 -o /tmp/capu-v19 \
            rtl/capu_delegated_nested_trap_v19.sv \
            rtl/tb/capu_delegated_nested_trap_v19_tb.sv
      - name: Run deterministic v0.19 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v19 | tee vcml-delegated-nested-trap-v19.log
          grep -F "CAPU_VCML_DELEGATED_NESTED_TRAP_V19_PASS" vcml-delegated-nested-trap-v19.log
          grep -F "unauthorized_delegation rejected=1" vcml-delegated-nested-trap-v19.log
          grep -F "outer_trap exact_parent=1 depth=1" vcml-delegated-nested-trap-v19.log
          grep -F "nested_trap exact_parent=1 depth=2 speculation_killed=1" vcml-delegated-nested-trap-v19.log
          grep -F "depth_overflow rejected=1" vcml-delegated-nested-trap-v19.log
          grep -F "nested_return exact_parent=1 depth=1" vcml-delegated-nested-trap-v19.log
          grep -F "outer_return exact_base=1 depth=0" vcml-delegated-nested-trap-v19.log
          grep -F "return_underflow rejected=1" vcml-delegated-nested-trap-v19.log
      - name: Run canonical v0.19 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_nested_trap_checkpoint_v19.py | tee vcml-nested-trap-checkpoint-v19-python.log
          grep -F "VCML_NESTED_TRAP_CHECKPOINT_V19_PASS" vcml-nested-trap-checkpoint-v19-python.log
          grep -F "delegation_change_digest_changed=1" vcml-nested-trap-checkpoint-v19-python.log
          grep -F "parent_context_change_digest_changed=1" vcml-nested-trap-checkpoint-v19-python.log
          grep -F "nested_context_change_digest_changed=1" vcml-nested-trap-checkpoint-v19-python.log
          grep -F "mixed_parent_snapshot_rejected=1" vcml-nested-trap-checkpoint-v19-python.log
      - name: Regress v0.18 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v18 rtl/capu_precise_trap_recovery_v18.sv rtl/tb/capu_precise_trap_recovery_v18_tb.sv
          vvp /tmp/capu-v18 | tee vcml-trap-privilege-v18-regression.log
          grep -F "CAPU_VCML_TRAP_PRIVILEGE_V18_PASS" vcml-trap-privilege-v18-regression.log
          python3 tests/test_vcml_trap_checkpoint_v18.py | tee vcml-trap-checkpoint-v18-python-regression.log
          grep -F "VCML_TRAP_CHECKPOINT_V18_PASS" vcml-trap-checkpoint-v18-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum \
            rtl/capu_delegated_nested_trap_v19.sv \
            rtl/tb/capu_delegated_nested_trap_v19_tb.sv \
            tools/vcml_nested_trap_checkpoint_v19.py \
            tests/test_vcml_nested_trap_checkpoint_v19.py \
            vcml-delegated-nested-trap-v19.log \
            vcml-nested-trap-checkpoint-v19-python.log \
            vcml-trap-privilege-v18-regression.log \
            vcml-trap-checkpoint-v18-python-regression.log > vcml-delegated-nested-trap-v19.sha256
          cat vcml-delegated-nested-trap-v19.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v19-delegated-nested-trap-evidence
          path: |
            vcml-delegated-nested-trap-v19.log
            vcml-nested-trap-checkpoint-v19-python.log
            vcml-trap-privilege-v18-regression.log
            vcml-trap-checkpoint-v18-python-regression.log
            vcml-delegated-nested-trap-v19.sha256

  delegated-nested-formal:
    name: Bounded v0.19 delegated nested trap proof
    needs: delegated-nested-rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.19 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v19-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v19-formal/safety-work formal/capu_delegated_nested_trap_v19.sby 2>&1 | tee target/capu-v19-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v19-formal/formal.log
          ! grep -q 'DONE (ERROR' target/capu-v19-formal/formal.log
      - name: Prove v0.19 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v19-formal/cover-work formal/capu_delegated_nested_trap_v19_cover.sby 2>&1 | tee target/capu-v19-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v19-formal/cover.log
          ! grep -q 'DONE (ERROR' target/capu-v19-formal/cover.log
          test "$(find target/capu-v19-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.18 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v19-formal/v18-safety-work formal/capu_precise_trap_recovery_v18.sby 2>&1 | tee target/capu-v19-formal/v18-formal.log
          grep -q 'DONE (PASS' target/capu-v19-formal/v18-formal.log
      - name: Seal v0.19 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v19-formal')
          safety=(root/'formal.log').read_text(errors='replace'); cover=(root/'cover.log').read_text(errors='replace'); v18=(root/'v18-formal.log').read_text(errors='replace')
          for label,log in [('v0.19 safety',safety),('v0.19 cover',cover),('v0.18 safety regression',v18)]:
              if 'DONE (PASS' not in log or 'DONE (ERROR' in log: raise SystemExit(label+' not PASS')
          inputs=[Path(x) for x in ['rtl/capu_delegated_nested_trap_v19.sv','formal/capu_delegated_nested_trap_v19_formal.sv','formal/capu_delegated_nested_trap_v19.sby','formal/capu_delegated_nested_trap_v19_cover.sby','tools/vcml_nested_trap_checkpoint_v19.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          witnesses=list((root/'cover-work').rglob('trace*.vcd'))
          proof={'schema':'capu.hardware.delegated-nested-trap-authority-formal-proof.v0.19','result':'PASS','depth':28,'cover_depth':34,'cover_witnesses':len(witnesses),'solver':'z3','v0_18_safety_regression':'PASS','invariants':['RESTORE_ACCEPT => EXACT_BOUND_DELEGATION_AND_TRAP_STACK','UNAUTHORIZED_DELEGATION => NO_TRAP_ENTER','DEPTH_2_TRAP_ENTER => REJECT','NESTED_TRAP_ENTER => EXACT_PARENT_CONTEXT_CAPTURE','TRAP_RETURN => EXACT_TOP_PARENT_CONTEXT','DEPTH_0_RETURN => REJECT','TRAP_OR_RECOVERY_BOUNDARY => NO_VISIBLE_EFFECT'],'claim_boundary':'bounded reduced-width two-level delegated trap authority model; no full ISA CSR delegation, arbitrary nesting, MMU/TLB, NMI/debug, production speculation, multicore, RTL SHA-256, durable media or unbounded correctness','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_18_regression_log_sha256':hashlib.sha256(v18.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip()}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v19-delegated-nested-trap-formal-evidence
          path: |
            target/capu-v19-formal/formal.log
            target/capu-v19-formal/cover.log
            target/capu-v19-formal/v18-formal.log
            target/capu-v19-formal/formal-proof.json
            target/capu-v19-formal/safety-work/
            target/capu-v19-formal/cover-work/
          if-no-files-found: warn
