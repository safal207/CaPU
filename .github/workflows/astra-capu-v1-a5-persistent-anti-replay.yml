name: ASTRA-CaPU v1.0-A5 Persistent Anti-Replay Frontier

on:
  pull_request:
    paths:
      - 'rtl/astra_capu_effect_counter_a3.sv'
      - 'rtl/astra_capu_persistent_frontier_store_a5.sv'
      - 'rtl/astra_capu_persistent_authority_shim_a5.sv'
      - 'rtl/astra_capu_persistent_authorized_effect_device_a5.sv'
      - 'rtl/tb/astra_capu_persistent_authorized_effect_device_a5_tb.sv'
      - 'formal/astra_capu_persistent_authority_a5*'
      - 'tools/astra_capu_persistent_authority_a5.py'
      - 'tests/test_astra_capu_persistent_authority_a5.py'
      - 'schemas/hardware/astra-capu-persistent-anti-replay-v1.0-a5.schema.json'
      - 'examples/hardware/astra-capu-v1-a5-expected.json'
      - 'docs/hardware/ASTRA_CAPU_V1_A5_PERSISTENT_ANTI_REPLAY.md'
      - '.github/workflows/astra-capu-v1-a5-persistent-anti-replay.yml'

jobs:
  deterministic:
    name: A5 logic-restart anti-replay trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V
      - name: Compile A5 persistent authority device
        run: |
          set -euo pipefail
          iverilog -g2012 \
            -o /tmp/astra-capu-a5.vvp \
            rtl/astra_capu_effect_counter_a3.sv \
            rtl/astra_capu_persistent_frontier_store_a5.sv \
            rtl/astra_capu_persistent_authority_shim_a5.sv \
            rtl/astra_capu_persistent_authorized_effect_device_a5.sv \
            rtl/tb/astra_capu_persistent_authorized_effect_device_a5_tb.sv
      - name: Run deterministic A5 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/astra-capu-a5.vvp | tee astra-capu-v1-a5-rtl.log
          grep -F 'a5_frontier_provisioned next_attempt=0' astra-capu-v1-a5-rtl.log
          grep -F 'a5_attempt0_forwarded forward=1 effect_count=1 persistent_next_attempt=1' astra-capu-v1-a5-rtl.log
          grep -F 'a5_logic_restart active_valid=0 effect_count=1 persistent_next_attempt=1' astra-capu-v1-a5-rtl.log
          grep -F 'a5_same_attempt_after_restart_blocked reject_code=8 effect_count=1' astra-capu-v1-a5-rtl.log
          grep -F 'a5_successor_attempt_forwarded attempt=1 effect_count=2 persistent_next_attempt=2' astra-capu-v1-a5-rtl.log
          grep -F 'a5_future_attempt_blocked attempt=3 frontier=2 reject_code=8' astra-capu-v1-a5-rtl.log
          grep -F 'ASTRA_CAPU_V1_A5_PERSISTENT_ANTI_REPLAY_PASS' astra-capu-v1-a5-rtl.log
      - name: Run A5 reference and unit tests
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_astra_capu_persistent_authority_a5.py \
            2>&1 | tee astra-capu-v1-a5-test.log
          python3 -m tools.astra_capu_persistent_authority_a5 \
            | tee astra-capu-v1-a5-reference.log
          grep -F 'Ran 11 tests' astra-capu-v1-a5-test.log
          grep -F 'OK' astra-capu-v1-a5-test.log
          grep -F 'ASTRA_CAPU_V1_A5_REFERENCE_PASS' astra-capu-v1-a5-reference.log
      - name: Regress A4 physical authority gate
        run: |
          set -euo pipefail
          iverilog -g2012 \
            -o /tmp/astra-capu-a4.vvp \
            rtl/astra_capu_effect_counter_a3.sv \
            rtl/astra_capu_authority_shim_a4.sv \
            rtl/astra_capu_authorized_effect_device_a4.sv \
            rtl/tb/astra_capu_authorized_effect_device_a4_tb.sv
          vvp /tmp/astra-capu-a4.vvp | tee astra-capu-v1-a4-regression.log
          python3 -m unittest -v tests/test_astra_capu_authority_shim_a4.py \
            2>&1 | tee astra-capu-v1-a4-test-regression.log
          grep -F 'ASTRA_CAPU_V1_A4_SYNTHESIZABLE_AUTHORITY_SHIM_PASS' astra-capu-v1-a4-regression.log
          grep -F 'Ran 10 tests' astra-capu-v1-a4-test-regression.log
          grep -F 'OK' astra-capu-v1-a4-test-regression.log
      - name: Generate and validate machine-readable result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.astra_capu_persistent_authority_a5 import scenario_result

          result = scenario_result()
          output = Path('astra-capu-v1-a5-result.json')
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          schema = json.loads(Path('schemas/hardware/astra-capu-persistent-anti-replay-v1.0-a5.schema.json').read_text())
          expected = json.loads(Path('examples/hardware/astra-capu-v1-a5-expected.json').read_text())['expected']
          assert schema['title'] == 'ASTRA–CaPU Persistent Anti-Replay Frontier v1.0-A5 Result'
          assert result == expected
          assert result['external_effect_count'] == 2
          assert result['restart_replay_reject_code'] == 8
          assert result['persistent_next_attempt'] == 2
          print(f"a5_machine_result_digest={result['result_digest_sha256']}")
          print('A5_MACHINE_RESULT_PASS')
          PY
      - name: Seal executable A5 evidence
        run: |
          cp /tmp/astra-capu-a5.vvp ./astra-capu-a5.vvp
          sha256sum \
            rtl/astra_capu_effect_counter_a3.sv \
            rtl/astra_capu_persistent_frontier_store_a5.sv \
            rtl/astra_capu_persistent_authority_shim_a5.sv \
            rtl/astra_capu_persistent_authorized_effect_device_a5.sv \
            rtl/tb/astra_capu_persistent_authorized_effect_device_a5_tb.sv \
            tools/astra_capu_persistent_authority_a5.py \
            tests/test_astra_capu_persistent_authority_a5.py \
            schemas/hardware/astra-capu-persistent-anti-replay-v1.0-a5.schema.json \
            examples/hardware/astra-capu-v1-a5-expected.json \
            docs/hardware/ASTRA_CAPU_V1_A5_PERSISTENT_ANTI_REPLAY.md \
            astra-capu-a5.vvp \
            astra-capu-v1-a5-rtl.log \
            astra-capu-v1-a5-test.log \
            astra-capu-v1-a5-reference.log \
            astra-capu-v1-a4-regression.log \
            astra-capu-v1-a4-test-regression.log \
            astra-capu-v1-a5-result.json \
            > astra-capu-v1-a5.sha256
          cat astra-capu-v1-a5.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: astra-capu-v1-a5-persistent-anti-replay-evidence
          path: |
            astra-capu-a5.vvp
            astra-capu-v1-a5-rtl.log
            astra-capu-v1-a5-test.log
            astra-capu-v1-a5-reference.log
            astra-capu-v1-a4-regression.log
            astra-capu-v1-a4-test-regression.log
            astra-capu-v1-a5-result.json
            astra-capu-v1-a5.sha256

  formal:
    name: Bounded A5 restart-safe anti-replay proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded A5 safety
        run: |
          set -euo pipefail
          mkdir -p target/astra-capu-a5-formal
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/astra-capu-a5-formal/safety-work \
            formal/astra_capu_persistent_authority_a5.sby \
            2>&1 | tee target/astra-capu-a5-formal/formal.log
          grep -q 'DONE (PASS' target/astra-capu-a5-formal/formal.log
      - name: Prove A5 restart paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/astra-capu-a5-formal/cover-work \
            formal/astra_capu_persistent_authority_a5_cover.sby \
            2>&1 | tee target/astra-capu-a5-formal/cover.log
          grep -q 'DONE (PASS' target/astra-capu-a5-formal/cover.log
          test "$(find target/astra-capu-a5-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress bounded A4 safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/astra-capu-a5-formal/a4-regression-work \
            formal/astra_capu_authority_shim_a4.sby \
            2>&1 | tee target/astra-capu-a5-formal/a4-regression.log
          grep -q 'DONE (PASS' target/astra-capu-a5-formal/a4-regression.log
      - name: Seal formal evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('target/astra-capu-a5-formal')
          safety = (root / 'formal.log').read_text(errors='replace')
          cover = (root / 'cover.log').read_text(errors='replace')
          a4 = (root / 'a4-regression.log').read_text(errors='replace')
          inputs = [Path(x) for x in [
              'rtl/astra_capu_effect_counter_a3.sv',
              'rtl/astra_capu_persistent_frontier_store_a5.sv',
              'rtl/astra_capu_persistent_authority_shim_a5.sv',
              'rtl/astra_capu_persistent_authorized_effect_device_a5.sv',
              'formal/astra_capu_persistent_authority_a5_formal.sv',
              'formal/astra_capu_persistent_authority_a5.sby',
              'formal/astra_capu_persistent_authority_a5_cover.sby',
              'tools/astra_capu_persistent_authority_a5.py',
          ]]
          h = hashlib.sha256()
          for path in inputs:
              h.update(str(path).encode() + b'\0' + path.read_bytes() + b'\0')
          proof = {
              'schema': 'capu.hardware.astra-persistent-anti-replay-formal-proof.v1.0-a5',
              'result': 'PASS',
              'proof_method': 'bounded model checking',
              'depth': 24,
              'cover_depth': 36,
              'cover_witnesses': len(list((root / 'cover-work').rglob('trace*.vcd'))),
              'formal_tag_width_bits': 3,
              'formal_identity_width_bits': 3,
              'persistent_lineage_count': 1,
              'logic_reset_persistence_model': True,
              'commit_before_effect': True,
              'formal_input_sha256': h.hexdigest(),
              'formal_log_sha256': hashlib.sha256(safety.encode()).hexdigest(),
              'cover_log_sha256': hashlib.sha256(cover.encode()).hexdigest(),
              'a4_regression_log_sha256': hashlib.sha256(a4.encode()).hexdigest(),
              'sby_git_sha': Path('/tmp/sby-sha.txt').read_text().strip(),
              'yosys_version': subprocess.check_output(['yosys', '-V'], text=True).strip(),
              'z3_version': subprocess.check_output(['z3', '--version'], text=True).strip(),
              'claim_boundary': 'bounded reduced-width single-lineage retention-domain frontier; logic-reset restart safety only, not actual NVRAM or complete power-loss persistence, cryptographic token verification, real accelerator transport, timing/PPA, liveness or unbounded correctness',
          }
          (root / 'formal-proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-capu-v1-a5-persistent-anti-replay-formal-evidence
          path: |
            target/astra-capu-a5-formal/formal.log
            target/astra-capu-a5-formal/cover.log
            target/astra-capu-a5-formal/a4-regression.log
            target/astra-capu-a5-formal/formal-proof.json
            target/astra-capu-a5-formal/safety-work/
            target/astra-capu-a5-formal/cover-work/
