name: CaPU vCML Shootdown Delivery Reliability v0.23

on:
  pull_request:
    paths:
      - "rtl/capu_shootdown_delivery_reliability_v23.sv"
      - "rtl/tb/capu_shootdown_delivery_reliability_v23_tb.sv"
      - "formal/capu_shootdown_delivery_reliability_v23_formal.sv"
      - "formal/capu_shootdown_delivery_reliability_v23.sby"
      - "formal/capu_shootdown_delivery_reliability_v23_cover.sby"
      - "tools/vcml_shootdown_delivery_checkpoint_v23.py"
      - "tests/test_vcml_shootdown_delivery_checkpoint_v23.py"
      - ".github/workflows/vcml-shootdown-delivery-reliability-v23.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-rtl:
    name: Lost-delivery and lost-ACK retry trajectory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.23
        run: iverilog -g2012 -o /tmp/capu-v23 rtl/capu_shootdown_delivery_reliability_v23.sv rtl/tb/capu_shootdown_delivery_reliability_v23_tb.sv
      - name: Run deterministic v0.23 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v23 | tee vcml-shootdown-reliability-v23.log
          grep -F "CAPU_VCML_SHOOTDOWN_RELIABILITY_V23_PASS" vcml-shootdown-reliability-v23.log
          grep -F "phantom_ack_before_delivery hart=0 rejected=1" vcml-shootdown-reliability-v23.log
          grep -F "hart0_retry attempt=2 accepted=1 delivered=1" vcml-shootdown-reliability-v23.log
          grep -F "stale_generation_retry hart=1 rejected=1" vcml-shootdown-reliability-v23.log
          grep -F "hart1_retry_after_lost_ack attempt=2 accepted=1 delivered=1" vcml-shootdown-reliability-v23.log
          grep -F "authority_reopened=1" vcml-shootdown-reliability-v23.log
          grep -F "retry_exhausted hart=0 rejected=1 attempts=3 authority_closed=1" vcml-shootdown-reliability-v23.log
          grep -F "recovery reliability_state_destroyed=1" vcml-shootdown-reliability-v23.log
      - name: Run canonical v0.23 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_shootdown_delivery_checkpoint_v23.py | tee vcml-shootdown-checkpoint-v23-python.log
          grep -F "VCML_SHOOTDOWN_DELIVERY_CHECKPOINT_V23_PASS" vcml-shootdown-checkpoint-v23-python.log
          grep -F "delivered_bitmap_change_digest_changed=1" vcml-shootdown-checkpoint-v23-python.log
          grep -F "attempts0_change_digest_changed=1" vcml-shootdown-checkpoint-v23-python.log
          grep -F "mixed_delivery_authority_rejected=1" vcml-shootdown-checkpoint-v23-python.log
      - name: Regress v0.22 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v22 rtl/capu_multihart_shootdown_quorum_v22.sv rtl/tb/capu_multihart_shootdown_quorum_v22_tb.sv
          vvp /tmp/capu-v22 | tee vcml-multihart-shootdown-v22-regression.log
          grep -F "CAPU_VCML_MULTIHART_SHOOTDOWN_V22_PASS" vcml-multihart-shootdown-v22-regression.log
          python3 tests/test_vcml_multihart_shootdown_checkpoint_v22.py | tee vcml-multihart-checkpoint-v22-python-regression.log
          grep -F "VCML_MULTIHART_SHOOTDOWN_CHECKPOINT_V22_PASS" vcml-multihart-checkpoint-v22-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_shootdown_delivery_reliability_v23.sv rtl/tb/capu_shootdown_delivery_reliability_v23_tb.sv tools/vcml_shootdown_delivery_checkpoint_v23.py tests/test_vcml_shootdown_delivery_checkpoint_v23.py vcml-shootdown-reliability-v23.log vcml-shootdown-checkpoint-v23-python.log vcml-multihart-shootdown-v22-regression.log vcml-multihart-checkpoint-v22-python-regression.log > vcml-shootdown-reliability-v23.sha256
          cat vcml-shootdown-reliability-v23.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v23-shootdown-delivery-evidence
          path: |
            vcml-shootdown-reliability-v23.log
            vcml-shootdown-checkpoint-v23-python.log
            vcml-multihart-shootdown-v22-regression.log
            vcml-multihart-checkpoint-v22-python-regression.log
            vcml-shootdown-reliability-v23.sha256

  reliability-formal:
    name: Bounded v0.23 delivery reliability proof
    needs: reliability-rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.23 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v23-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v23-formal/safety-work formal/capu_shootdown_delivery_reliability_v23.sby 2>&1 | tee target/capu-v23-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v23-formal/formal.log
          ! grep -q 'DONE (ERROR' target/capu-v23-formal/formal.log
      - name: Prove v0.23 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v23-formal/cover-work formal/capu_shootdown_delivery_reliability_v23_cover.sby 2>&1 | tee target/capu-v23-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v23-formal/cover.log
          ! grep -q 'DONE (ERROR' target/capu-v23-formal/cover.log
          test "$(find target/capu-v23-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.22 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v23-formal/v22-safety-work formal/capu_multihart_shootdown_quorum_v22.sby 2>&1 | tee target/capu-v23-formal/v22-formal.log
          grep -q 'DONE (PASS' target/capu-v23-formal/v22-formal.log
          ! grep -q 'DONE (ERROR' target/capu-v23-formal/v22-formal.log
      - name: Seal v0.23 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v23-formal')
          safety=(root/'formal.log').read_text(errors='replace');cover=(root/'cover.log').read_text(errors='replace');v22=(root/'v22-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_shootdown_delivery_reliability_v23.sv','formal/capu_shootdown_delivery_reliability_v23_formal.sv','formal/capu_shootdown_delivery_reliability_v23.sby','formal/capu_shootdown_delivery_reliability_v23_cover.sby','tools/vcml_shootdown_delivery_checkpoint_v23.py']]
          h=hashlib.sha256()
          for p in inputs:h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.shootdown-delivery-reliability-formal-proof.v0.23','result':'PASS','depth':36,'cover_depth':44,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'v0_22_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_22_regression_log_sha256':hashlib.sha256(v22.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width two-hart one-generation delivery/retry authority with max three attempts per hart; no production transport or liveness guarantee'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n');print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v23-shootdown-delivery-formal-evidence
          path: |
            target/capu-v23-formal/formal.log
            target/capu-v23-formal/cover.log
            target/capu-v23-formal/v22-formal.log
            target/capu-v23-formal/formal-proof.json
            target/capu-v23-formal/safety-work/
            target/capu-v23-formal/cover-work/
          if-no-files-found: warn
