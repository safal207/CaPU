name: CaPU vCML Overlapping DMA Fragment Recovery v0.30

on:
  pull_request:
    paths:
      - 'rtl/capu_overlapping_dma_fragment_recovery_v30.sv'
      - 'rtl/tb/capu_overlapping_dma_fragment_recovery_v30_tb.sv'
      - 'tools/vcml_overlapping_dma_checkpoint_v30.py'
      - 'tests/test_vcml_overlapping_dma_checkpoint_v30.py'
      - 'formal/capu_overlapping_dma_fragment_recovery_v30*'
      - '.github/workflows/vcml-overlapping-dma-fragment-recovery-v30.yml'
      - 'docs/hardware/CAPU_VCML_OVERLAPPING_DMA_FRAGMENT_RECOVERY_V30.md'

jobs:
  deterministic:
    name: Overlapping DMA fragment deterministic trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.30
        run: iverilog -g2012 -o /tmp/capu-v30 rtl/capu_overlapping_dma_fragment_recovery_v30.sv rtl/tb/capu_overlapping_dma_fragment_recovery_v30_tb.sv
      - name: Run deterministic v0.30 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v30 | tee vcml-overlapping-dma-v30.log
          grep -F 'CAPU_VCML_OVERLAPPING_DMA_FRAGMENT_RECOVERY_V30_PASS' vcml-overlapping-dma-v30.log
          grep -F 'out_of_order_commit committed_set=0101 owner_map=A0 prefix_assumption=0' vcml-overlapping-dma-v30.log
          grep -F 'overlap_checkpoint states=COMMITTED,UNKNOWN,COMMITTED,UNKNOWN owners=A0' vcml-overlapping-dma-v30.log
          grep -F 'partial_set_restore committed_nonprefix=0101 unknown=1010 replay_committed_blocked=1' vcml-overlapping-dma-v30.log
          grep -F 'overlap_commit fragment=3 owners=E3 overwrote_lanes=3,0 committed_history_preserved=1' vcml-overlapping-dma-v30.log
          grep -F 'final_overlap_commit fragment=1 owners=D7 completion_bitmap=1111 all_fragments_committed=1' vcml-overlapping-dma-v30.log
          grep -F 'late_stale_restore completion_receipts_win=1 durable_owner_map_wins=1 states=ALL_COMMITTED owners=D7 replay=0000' vcml-overlapping-dma-v30.log
      - name: Run canonical v0.30 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_overlapping_dma_checkpoint_v30.py | tee vcml-overlapping-dma-checkpoint-v30-python.log
          grep -F 'VCML_OVERLAPPING_DMA_CHECKPOINT_V30_PASS' vcml-overlapping-dma-checkpoint-v30-python.log
          grep -F 'committed_without_completion_receipt_rejected=1' vcml-overlapping-dma-checkpoint-v30-python.log
          grep -F 'foreign_receipt_identity_mixed_state_rejected=1' vcml-overlapping-dma-checkpoint-v30-python.log
          grep -F 'owner_without_fragment_commit_rejected=1' vcml-overlapping-dma-checkpoint-v30-python.log
          grep -F 'overlap_owner_wrong_lane_rejected=1' vcml-overlapping-dma-checkpoint-v30-python.log
      - name: Regress v0.29 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v29 rtl/capu_multibeat_dma_recovery_v29.sv rtl/tb/capu_multibeat_dma_recovery_v29_tb.sv
          vvp /tmp/capu-v29 | tee vcml-multibeat-dma-v29-regression.log
          grep -F 'CAPU_VCML_MULTIBEAT_DMA_RECOVERY_V29_PASS' vcml-multibeat-dma-v29-regression.log
          python3 tests/test_vcml_multibeat_dma_checkpoint_v29.py | tee vcml-multibeat-dma-checkpoint-v29-python-regression.log
          grep -F 'VCML_MULTIBEAT_DMA_CHECKPOINT_V29_PASS' vcml-multibeat-dma-checkpoint-v29-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_overlapping_dma_fragment_recovery_v30.sv rtl/tb/capu_overlapping_dma_fragment_recovery_v30_tb.sv tools/vcml_overlapping_dma_checkpoint_v30.py tests/test_vcml_overlapping_dma_checkpoint_v30.py vcml-overlapping-dma-v30.log vcml-overlapping-dma-checkpoint-v30-python.log vcml-multibeat-dma-v29-regression.log vcml-multibeat-dma-checkpoint-v29-python-regression.log > vcml-overlapping-dma-v30.sha256
          cat vcml-overlapping-dma-v30.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v30-overlapping-dma-evidence
          path: |
            vcml-overlapping-dma-v30.log
            vcml-overlapping-dma-checkpoint-v30-python.log
            vcml-multibeat-dma-v29-regression.log
            vcml-multibeat-dma-checkpoint-v29-python-regression.log
            vcml-overlapping-dma-v30.sha256

  formal:
    name: Bounded v0.30 overlapping DMA fragment proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.30 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v30-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v30-formal/safety-work formal/capu_overlapping_dma_fragment_recovery_v30.sby 2>&1 | tee target/capu-v30-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v30-formal/formal.log
      - name: Prove v0.30 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v30-formal/cover-work formal/capu_overlapping_dma_fragment_recovery_v30_cover.sby 2>&1 | tee target/capu-v30-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v30-formal/cover.log
          test "$(find target/capu-v30-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.29 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v30-formal/v29-safety-work formal/capu_multibeat_dma_recovery_v29.sby 2>&1 | tee target/capu-v30-formal/v29-formal.log
          grep -q 'DONE (PASS' target/capu-v30-formal/v29-formal.log
      - name: Seal v0.30 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v30-formal')
          safety=(root/'formal.log').read_text(errors='replace'); cover=(root/'cover.log').read_text(errors='replace'); v29=(root/'v29-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_overlapping_dma_fragment_recovery_v30.sv','formal/capu_overlapping_dma_fragment_recovery_v30_formal.sv','formal/capu_overlapping_dma_fragment_recovery_v30.sby','formal/capu_overlapping_dma_fragment_recovery_v30_cover.sby','tools/vcml_overlapping_dma_checkpoint_v30.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.overlapping-dma-fragment-recovery-formal-proof.v0.30','result':'PASS','proof_method':'bounded model checking','depth':14,'cover_depth':26,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'formal_identity_width_bits':2,'fragment_count':4,'byte_lane_count':4,'v0_29_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_29_regression_log_sha256':hashlib.sha256(v29.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width one-command four-fragment four-byte-lane model with fixed overlapping masks and durable visible-owner provenance; no production transport, arbitrary addresses/masks, data-value semantics, or multiple concurrent transactions'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v30-overlapping-dma-formal-evidence
          path: |
            target/capu-v30-formal/formal.log
            target/capu-v30-formal/cover.log
            target/capu-v30-formal/v29-formal.log
            target/capu-v30-formal/formal-proof.json
            target/capu-v30-formal/safety-work/
            target/capu-v30-formal/cover-work/
