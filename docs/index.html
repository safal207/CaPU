<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=./hardware/CAPU_PROGRESS_DASHBOARD.html" />
  <title>CaPU Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #34d399;
      --line: rgba(148, 163, 184, 0.24);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(96, 165, 250, 0.16), transparent 32%),
        radial-gradient(circle at 80% 20%, rgba(52, 211, 153, 0.14), transparent 30%),
        var(--bg);
      color: var(--text);
    }
    main {
      width: min(760px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)), var(--panel);
      box-shadow: 0 18px 50px rgba(0,0,0,0.28);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0;
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }
    p { color: var(--muted); font-size: 17px; }
    a {
      display: inline-flex;
      margin-top: 10px;
      padding: 11px 15px;
      border-radius: 999px;
      color: #052e24;
      background: var(--accent);
      text-decoration: none;
      font-weight: 850;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">CaPU / GitHub Pages</div>
    <h1>Opening the CaPU progress dashboard…</h1>
    <p>If the redirect does not happen automatically, open the interactive progress dashboard manually.</p>
    <a href="./hardware/CAPU_PROGRESS_DASHBOARD.html">Open dashboard</a>
  </main>
</body>
</html>
