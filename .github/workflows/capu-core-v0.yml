name: CaPU Core v0 RTL Smoke

on:
  push:
    branches:
      - agent/capu-core-v0
    paths:
      - 'rtl/**'
      - 'docs/hardware/CAPU_CORE_V0.md'
      - 'docs/hardware/CAPU_CORE_V01_STORE.md'
      - '.github/workflows/capu-core-v0.yml'
  pull_request:
    paths:
      - 'rtl/**'
      - 'docs/hardware/CAPU_CORE_V0.md'
      - 'docs/hardware/CAPU_CORE_V01_STORE.md'
      - '.github/workflows/capu-core-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Commit and STORE boundary smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Compile CaPU Core v0 register commit controller
        run: |
          mkdir -p target/capu-core-v0
          iverilog -g2012 \
            -s capu_commit_controller_tb \
            -o target/capu-core-v0/capu_commit_controller_tb \
            rtl/capu_commit_controller.sv \
            rtl/tb/capu_commit_controller_tb.sv

      - name: Run causal register commit smoke test
        run: |
          vvp target/capu-core-v0/capu_commit_controller_tb | tee target/capu-core-v0/register-smoke.log
          grep -q 'CAPU_CORE_V0_SMOKE_PASS' target/capu-core-v0/register-smoke.log

      - name: Compile CaPU Core v0.1 speculative STORE buffer
        run: |
          iverilog -g2012 \
            -s capu_store_buffer_tb \
            -o target/capu-core-v0/capu_store_buffer_tb \
            rtl/capu_store_buffer.sv \
            rtl/tb/capu_store_buffer_tb.sv

      - name: Run causal STORE retirement smoke test
        run: |
          vvp target/capu-core-v0/capu_store_buffer_tb | tee target/capu-core-v0/store-smoke.log
          grep -q 'CAPU_CORE_V01_STORE_PASS' target/capu-core-v0/store-smoke.log
          grep -q 'S4 flushed buffer=0 memory_write=0' target/capu-core-v0/store-smoke.log
          grep -q 'S5 committed addr=0042 data=CAFE0042 memory_write=1' target/capu-core-v0/store-smoke.log
          grep -q 'S6 retired buffer=0 memory_write=0' target/capu-core-v0/store-smoke.log

      - name: Seal deterministic STORE trace
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('target/capu-core-v0')
          log = root / 'store-smoke.log'
          data = log.read_bytes()
          digest = hashlib.sha256(data).hexdigest()

          proof = {
              'schema': 'capu.hardware.store-proof.v0',
              'design': 'CaPU Core v0.1 one-entry speculative STORE buffer',
              'trace_sha256': digest,
              'primary_invariant': 'MEMORY_VISIBLE_WRITE => VALID_CAUSAL_COMMIT',
              'flush_priority': 'flush > commit > issue',
              'required_markers': [
                  'S2 speculative',
                  'S3 causal_invalid',
                  'S4 flushed buffer=0 memory_write=0',
                  'S5 committed addr=0042 data=CAFE0042 memory_write=1',
                  'S6 retired buffer=0 memory_write=0',
                  'CAPU_CORE_V01_STORE_PASS',
              ],
          }
          proof['markers_verified'] = all(
              marker.encode() in data for marker in proof['required_markers']
          )
          if not proof['markers_verified']:
              raise SystemExit('required STORE trace markers are missing')

          (root / 'store-proof.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'CAPU_STORE_TRACE_SHA256={digest}')
          PY
          cat target/capu-core-v0/store-proof.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-core-v0-smoke-evidence
          path: target/capu-core-v0/
          if-no-files-found: warn
