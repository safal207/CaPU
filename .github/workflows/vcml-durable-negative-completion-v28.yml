name: CaPU vCML Durable Negative Completion v0.28

on:
  pull_request:
    paths:
      - 'rtl/capu_durable_negative_completion_v28.sv'
      - 'rtl/tb/capu_durable_negative_completion_v28_tb.sv'
      - 'tools/vcml_durable_negative_checkpoint_v28.py'
      - 'tests/test_vcml_durable_negative_checkpoint_v28.py'
      - 'formal/capu_durable_negative_completion_v28*'
      - '.github/workflows/vcml-durable-negative-completion-v28.yml'
      - 'docs/hardware/CAPU_VCML_DURABLE_NEGATIVE_COMPLETION_V28.md'

jobs:
  deterministic:
    name: Durable negative completion deterministic trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.28
        run: iverilog -g2012 -o /tmp/capu-v28 rtl/capu_durable_negative_completion_v28.sv rtl/tb/capu_durable_negative_completion_v28_tb.sv
      - name: Run deterministic v0.28 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v28 | tee vcml-durable-negative-v28.log
          grep -F 'CAPU_VCML_DURABLE_NEGATIVE_COMPLETION_V28_PASS' vcml-durable-negative-v28.log
          grep -F 'exact_evidence_not_committed accepted=1 durable_negative_receipt=1 replay_authority=1' vcml-durable-negative-v28.log
          grep -F 'stale_unknown_restore negative_receipt_wins=1 completion=NOT_COMMITTED replay_authority=1' vcml-durable-negative-v28.log
          grep -F 'retry_issue accepted=1 old_negative_receipt_consumed=1 completion=UNKNOWN' vcml-durable-negative-v28.log
          grep -F 'retry_crash_restore current_issue_witness_wins=1 completion=UNKNOWN replay_authority=0' vcml-durable-negative-v28.log
          grep -F 'late_stale_unknown_restore completion_receipt_wins=1 completion=COMMITTED replay_authority=0' vcml-durable-negative-v28.log
      - name: Run canonical v0.28 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_durable_negative_checkpoint_v28.py | tee vcml-durable-negative-checkpoint-v28-python.log
          grep -F 'VCML_DURABLE_NEGATIVE_CHECKPOINT_V28_PASS' vcml-durable-negative-checkpoint-v28-python.log
          grep -F 'foreign_negative_receipt_mixed_state_rejected=1' vcml-durable-negative-checkpoint-v28-python.log
          grep -F 'stale_negative_receipt_survives_retry_mixed_state_rejected=1' vcml-durable-negative-checkpoint-v28-python.log
      - name: Regress v0.27 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v27 rtl/capu_dma_completion_uncertainty_v27.sv rtl/tb/capu_dma_completion_uncertainty_v27_tb.sv
          vvp /tmp/capu-v27 | tee vcml-dma-completion-v27-regression.log
          grep -F 'CAPU_VCML_DMA_COMPLETION_UNCERTAINTY_V27_PASS' vcml-dma-completion-v27-regression.log
          python3 tests/test_vcml_dma_completion_checkpoint_v27.py | tee vcml-dma-completion-checkpoint-v27-python-regression.log
          grep -F 'VCML_DMA_COMPLETION_CHECKPOINT_V27_PASS' vcml-dma-completion-checkpoint-v27-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_durable_negative_completion_v28.sv rtl/tb/capu_durable_negative_completion_v28_tb.sv tools/vcml_durable_negative_checkpoint_v28.py tests/test_vcml_durable_negative_checkpoint_v28.py vcml-durable-negative-v28.log vcml-durable-negative-checkpoint-v28-python.log vcml-dma-completion-v27-regression.log vcml-dma-completion-checkpoint-v27-python-regression.log > vcml-durable-negative-v28.sha256
          cat vcml-durable-negative-v28.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v28-durable-negative-evidence
          path: |
            vcml-durable-negative-v28.log
            vcml-durable-negative-checkpoint-v28-python.log
            vcml-dma-completion-v27-regression.log
            vcml-dma-completion-checkpoint-v27-python-regression.log
            vcml-durable-negative-v28.sha256

  formal:
    name: Bounded v0.28 durable negative completion proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.28 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v28-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v28-formal/safety-work formal/capu_durable_negative_completion_v28.sby 2>&1 | tee target/capu-v28-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v28-formal/formal.log
      - name: Prove v0.28 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v28-formal/cover-work formal/capu_durable_negative_completion_v28_cover.sby 2>&1 | tee target/capu-v28-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v28-formal/cover.log
          test "$(find target/capu-v28-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.27 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v28-formal/v27-safety-work formal/capu_dma_completion_uncertainty_v27.sby 2>&1 | tee target/capu-v28-formal/v27-formal.log
          grep -q 'DONE (PASS' target/capu-v28-formal/v27-formal.log
      - name: Seal v0.28 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v28-formal')
          safety=(root/'formal.log').read_text(errors='replace'); cover=(root/'cover.log').read_text(errors='replace'); v27=(root/'v27-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_durable_negative_completion_v28.sv','formal/capu_durable_negative_completion_v28_formal.sv','formal/capu_durable_negative_completion_v28.sby','formal/capu_durable_negative_completion_v28_cover.sby','tools/vcml_durable_negative_checkpoint_v28.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.durable-negative-completion-formal-proof.v0.28','result':'PASS','proof_method':'bounded model checking','depth':18,'cover_depth':28,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'formal_identity_width_bits':2,'v0_27_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_27_regression_log_sha256':hashlib.sha256(v27.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width one-command one-DMA-effect durable negative completion evidence and UNKNOWN convergence; authoritative evidence is modeled; no production transport, evidence-authenticity, or partial-write semantics'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v28-durable-negative-formal-evidence
          path: |
            target/capu-v28-formal/formal.log
            target/capu-v28-formal/cover.log
            target/capu-v28-formal/v27-formal.log
            target/capu-v28-formal/formal-proof.json
            target/capu-v28-formal/safety-work/
            target/capu-v28-formal/cover-work/
