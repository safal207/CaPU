name: CMC Rust Simulator

on:
  push:
    paths:
      - "rust/cmc-core/**"
      - "scripts/run-cmc-reviewer-demo.mjs"
      - "package.json"
      - ".github/workflows/cmc-rust.yml"
  pull_request:
    paths:
      - "rust/cmc-core/**"
      - "scripts/run-cmc-reviewer-demo.mjs"
      - "package.json"
      - ".github/workflows/cmc-rust.yml"
  workflow_dispatch:

jobs:
  test:
    name: cargo test + demos + SHA-256 trace + sealed fixtures + replay + audit checks + reviewer demo
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust/cmc-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/cmc-core/target
          key: ${{ runner.os }}-cmc-rust-${{ hashFiles('rust/cmc-core/Cargo.toml', 'rust/cmc-core/Cargo.lock', 'rust/cmc-core/src/**/*.rs', 'rust/cmc-core/fixtures/replay/**/*.jsonl', 'rust/cmc-core/fixtures/trace_integrity/**/*.jsonl', 'scripts/run-cmc-reviewer-demo.mjs', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-cmc-rust-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --all --locked

      - name: Run executable CMC demo
        run: cargo run --bin cmc_demo --locked

      - name: Verify legacy trace hash chain
        run: cargo run --bin verify_trace --locked

      - name: Verify legacy tampering detection demo
        run: cargo run --bin verify_trace_tampered --locked

      - name: Verify SHA-256 trace sealing
        run: cargo run --bin verify_trace_sha256 --locked

      - name: Verify SHA-256 tampering detection demo
        run: cargo run --bin verify_trace_sha256_tampered --locked

      - name: Verify SHA-256 sealed trace fixtures
        run: cargo run --bin verify_trace_sha256_fixture --locked

      - name: Verify replay fixture structure
        run: cargo run --bin replay_fixture_verify --locked

      - name: Verify replay fixture fingerprints
        run: cargo run --bin replay_fingerprint_verify --locked

      - name: Emit manifest-linked audit report
        run: cargo run --bin cmc_audit_report --locked

      - name: Verify saved audit report examples
        run: cargo run --bin audit_report_example_verify --locked

      - name: Verify replay divergence detection
        run: cargo run --bin trace_divergence --locked

      - name: Run one-command CMC reviewer demo
        working-directory: .
        run: npm run review:cmc
