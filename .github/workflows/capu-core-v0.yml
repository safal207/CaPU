name: CaPU Core v0 RTL Smoke

on:
  push:
    branches:
      - agent/capu-core-v0
    paths:
      - 'rtl/**'
      - 'formal/**'
      - 'docs/hardware/CAPU_CORE_V0.md'
      - 'docs/hardware/CAPU_CORE_V01_STORE.md'
      - '.github/workflows/capu-core-v0.yml'
  pull_request:
    paths:
      - 'rtl/**'
      - 'formal/**'
      - 'docs/hardware/CAPU_CORE_V0.md'
      - 'docs/hardware/CAPU_CORE_V01_STORE.md'
      - '.github/workflows/capu-core-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Commit and STORE boundary smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V

      - name: Compile CaPU Core v0 register commit controller
        run: |
          mkdir -p target/capu-core-v0
          iverilog -g2012 \
            -s capu_commit_controller_tb \
            -o target/capu-core-v0/capu_commit_controller_tb \
            rtl/capu_commit_controller.sv \
            rtl/tb/capu_commit_controller_tb.sv

      - name: Run causal register commit smoke test
        run: |
          set -o pipefail
          vvp target/capu-core-v0/capu_commit_controller_tb | tee target/capu-core-v0/register-smoke.log
          grep -q 'CAPU_CORE_V0_SMOKE_PASS' target/capu-core-v0/register-smoke.log

      - name: Compile CaPU Core v0.1 speculative STORE buffer
        run: |
          iverilog -g2012 \
            -s capu_store_buffer_tb \
            -o target/capu-core-v0/capu_store_buffer_tb \
            rtl/capu_store_buffer.sv \
            rtl/tb/capu_store_buffer_tb.sv

      - name: Run causal STORE retirement smoke test
        run: |
          set -o pipefail
          vvp target/capu-core-v0/capu_store_buffer_tb | tee target/capu-core-v0/store-smoke.log
          grep -q 'CAPU_CORE_V01_STORE_PASS' target/capu-core-v0/store-smoke.log
          grep -q 'S4 flushed buffer=0 memory_write=0' target/capu-core-v0/store-smoke.log
          grep -q 'S5 committed addr=0042 data=CAFE0042 memory_write=1' target/capu-core-v0/store-smoke.log
          grep -q 'S6 retired buffer=0 memory_write=0' target/capu-core-v0/store-smoke.log

      - name: Seal deterministic STORE trace
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('target/capu-core-v0')
          log = root / 'store-smoke.log'
          data = log.read_bytes()
          digest = hashlib.sha256(data).hexdigest()

          proof = {
              'schema': 'capu.hardware.store-proof.v0',
              'design': 'CaPU Core v0.1 one-entry speculative STORE buffer',
              'trace_sha256': digest,
              'primary_invariant': 'MEMORY_VISIBLE_WRITE => VALID_CAUSAL_COMMIT',
              'flush_priority': 'flush > commit > issue',
              'required_markers': [
                  'S2 speculative',
                  'S3 causal_invalid',
                  'S4 flushed buffer=0 memory_write=0',
                  'S5 committed addr=0042 data=CAFE0042 memory_write=1',
                  'S6 retired buffer=0 memory_write=0',
                  'CAPU_CORE_V01_STORE_PASS',
              ],
          }
          proof['markers_verified'] = all(
              marker.encode() in data for marker in proof['required_markers']
          )
          if not proof['markers_verified']:
              raise SystemExit('required STORE trace markers are missing')

          (root / 'store-proof.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'CAPU_STORE_TRACE_SHA256={digest}')
          PY
          cat target/capu-core-v0/store-proof.json

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-core-v0-smoke-evidence
          path: target/capu-core-v0/
          if-no-files-found: warn

  formal:
    name: Bounded causal STORE proof
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version

      - name: Install SBY formal front-end
        run: |
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          git -C /tmp/sby rev-parse HEAD | tee /tmp/sby-sha.txt
          python3 /tmp/sby/sbysrc/sby.py --version

      - name: Prove causal STORE boundary for arbitrary bounded sequences
        run: |
          set -o pipefail
          mkdir -p target/capu-core-v0
          python3 /tmp/sby/sbysrc/sby.py \
            -f \
            -d target/capu-core-v0/formal-work \
            formal/capu_store_buffer.sby \
            2>&1 | tee target/capu-core-v0/formal.log
          grep -q 'DONE (PASS' target/capu-core-v0/formal.log
          if grep -q 'DONE (ERROR' target/capu-core-v0/formal.log; then
            echo 'SBY reported ERROR; refusing to seal proof' >&2
            exit 1
          fi

      - name: Seal formal evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('target/capu-core-v0')
          log_text = (root / 'formal.log').read_text(encoding='utf-8', errors='replace')
          if 'DONE (PASS' not in log_text or 'DONE (ERROR' in log_text:
              raise SystemExit('formal solver did not produce an authenticated PASS status')

          inputs = [
              Path('rtl/capu_store_buffer.sv'),
              Path('formal/capu_store_buffer_formal.sv'),
              Path('formal/capu_store_buffer.sby'),
          ]

          h = hashlib.sha256()
          for path in inputs:
              h.update(str(path).encode())
              h.update(b'\0')
              h.update(path.read_bytes())
              h.update(b'\0')

          proof = {
              'schema': 'capu.hardware.formal-proof.v0',
              'design': 'CaPU Core v0.1 one-entry speculative STORE buffer',
              'result': 'PASS',
              'result_basis': 'SBY DONE (PASS) observed in formal.log',
              'mode': 'bounded model checking',
              'depth': 20,
              'engine': 'smtbmc',
              'solver': 'z3',
              'primary_invariant': 'MEMORY_VISIBLE_WRITE => VALID_CAUSAL_COMMIT',
              'formal_input_sha256': h.hexdigest(),
              'formal_log_sha256': hashlib.sha256(log_text.encode()).hexdigest(),
              'sby_git_sha': Path('/tmp/sby-sha.txt').read_text().strip(),
              'yosys_version': subprocess.check_output(['yosys', '-V'], text=True).strip(),
              'z3_version': subprocess.check_output(['z3', '--version'], text=True).strip(),
          }

          (root / 'formal-proof.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-core-v01-formal-evidence
          path: |
            target/capu-core-v0/formal.log
            target/capu-core-v0/formal-proof.json
            target/capu-core-v0/formal-work/
          if-no-files-found: warn
