name: Raiden Upstream JAX CPU Recovery Baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/raiden-upstream-cpu.yml"
      - "tools/raiden_upstream_evidence.py"
      - "docs/hardware/RAIDEN_CAUSAL_CRASH_RECOVERY.md"
  pull_request:
    paths:
      - ".github/workflows/raiden-upstream-cpu.yml"
      - "tools/raiden_upstream_evidence.py"
      - "docs/hardware/RAIDEN_CAUSAL_CRASH_RECOVERY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raiden-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-recovery:
    name: Pinned google/tpu-raiden JAX recovery E2E on CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      RAIDEN_UPSTREAM_REPO: https://github.com/google/tpu-raiden.git
      RAIDEN_UPSTREAM_SHA: 050d32bc7173d6413d32a8152118d0bad44c034d
      RAIDEN_BAZEL_VERSION: 8.6.0
      RAIDEN_BAZEL_TARGET: //tpu_raiden/api/jax:kv_cache_store_recovery_e2e_test
      RAIDEN_BAZEL_DISK_CACHE: ${{ github.workspace }}/.bazel-disk-cache

    steps:
      - name: Checkout CaPU
        uses: actions/checkout@v4

      - name: Self-test CaPU upstream evidence adapter
        run: python3 tools/raiden_upstream_evidence.py --self-test

      - name: Install pinned Bazel
        run: |
          set -euo pipefail
          url="https://github.com/bazelbuild/bazel/releases/download/${RAIDEN_BAZEL_VERSION}/bazel-${RAIDEN_BAZEL_VERSION}-linux-x86_64"
          curl --fail --location --retry 3 "$url" --output /tmp/bazel
          chmod +x /tmp/bazel
          sudo install /tmp/bazel /usr/local/bin/bazel
          bazel --version
          test "$(bazel --version)" = "bazel ${RAIDEN_BAZEL_VERSION}"

      - name: Checkout pinned upstream Raiden
        run: |
          set -euo pipefail
          git init upstream-raiden
          git -C upstream-raiden remote add origin "$RAIDEN_UPSTREAM_REPO"
          git -C upstream-raiden fetch --depth=1 origin "$RAIDEN_UPSTREAM_SHA"
          git -C upstream-raiden checkout --detach FETCH_HEAD
          actual="$(git -C upstream-raiden rev-parse HEAD)"
          echo "actual_upstream_sha=$actual"
          test "$actual" = "$RAIDEN_UPSTREAM_SHA"
          test "$(cat upstream-raiden/.bazelversion)" = "$RAIDEN_BAZEL_VERSION"

      - name: Restore Bazel disk cache
        id: raiden-bazel-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.bazel-disk-cache
          # A workflow re-run keeps run_id but increments run_attempt. Cache
          # entries are immutable, so include both to persist newer partial
          # Bazel outputs after every bounded seed attempt.
          key: raiden-bazel-${{ runner.os }}-8.6.0-050d32bc7173d6413d32a8152118d0bad44c034d-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            raiden-bazel-${{ runner.os }}-8.6.0-050d32bc7173d6413d32a8152118d0bad44c034d-

      - name: Run upstream JAX CPU recovery E2E
        working-directory: upstream-raiden
        run: |
          mkdir -p ../evidence/raiden-upstream "$RAIDEN_BAZEL_DISK_CACHE"
          set +e
          timeout --signal=TERM --kill-after=30s 70m \
            bazel test --config=oss "$RAIDEN_BAZEL_TARGET" \
              --disk_cache="$RAIDEN_BAZEL_DISK_CACHE" \
              --experimental_disk_cache_gc_max_size=6G \
              --test_output=all \
              --test_env=JAX_PLATFORMS=cpu \
              --test_env=XLA_FLAGS=--xla_force_host_platform_device_count=1 \
            2>&1 | tee ../evidence/raiden-upstream/bazel-test.log
          code=${PIPESTATUS[0]}
          set -e
          echo "RAIDEN_BAZEL_EXIT_CODE=$code" >> "$GITHUB_ENV"
          echo "bazel_exit_code=$code"
          if [ "$code" -eq 124 ]; then
            echo "Bazel execution reached the 70-minute seed budget; preserving the disk cache for the next run."
          fi
          # Keep the job alive long enough to persist partial build outputs and evidence.
          exit 0

      - name: Save partial Bazel disk cache
        if: always() && env.RAIDEN_BAZEL_EXIT_CODE == '124'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.bazel-disk-cache
          key: ${{ steps.raiden-bazel-cache-restore.outputs.cache-primary-key }}

      - name: Seal upstream execution into CaPU proof
        if: env.RAIDEN_BAZEL_EXIT_CODE == '0'
        run: |
          python3 tools/raiden_upstream_evidence.py \
            --log evidence/raiden-upstream/bazel-test.log \
            --source upstream-raiden/tpu_raiden/api/jax/kv_cache_store_recovery_e2e_test.py \
            --upstream-sha "$RAIDEN_UPSTREAM_SHA" \
            --bazel-version "$RAIDEN_BAZEL_VERSION" \
            --bazel-target "$RAIDEN_BAZEL_TARGET" \
            --bazel-exit-code "$RAIDEN_BAZEL_EXIT_CODE" \
            --output evidence/raiden-upstream/capu-upstream-proof.json

      - name: Capture upstream baseline manifest
        if: always()
        run: |
          mkdir -p evidence/raiden-upstream
          bazel_exit_code="${RAIDEN_BAZEL_EXIT_CODE:-not_run}"
          case "$bazel_exit_code" in
            0) execution_status="passed" ;;
            124) execution_status="time_budget_exhausted_cache_seeded" ;;
            not_run) execution_status="not_run" ;;
            *) execution_status="failed" ;;
          esac
          cat > evidence/raiden-upstream/manifest.json <<EOF
          {
            "schema": "capu.raiden.upstream-baseline.v0",
            "target": "google/tpu-raiden",
            "upstream_sha": "${RAIDEN_UPSTREAM_SHA}",
            "bazel_version": "${RAIDEN_BAZEL_VERSION}",
            "bazel_target": "${RAIDEN_BAZEL_TARGET}",
            "bazel_config": "oss",
            "bazel_exit_code": "${bazel_exit_code}",
            "execution_status": "${execution_status}",
            "requested_device_mode": "JAX CPU",
            "build_cache": "bazel disk cache via GitHub Actions cache",
            "claim_scope": "Execution result for the pinned upstream Raiden JAX recovery E2E target on a GitHub-hosted CPU runner."
          }
          EOF
          sha256sum evidence/raiden-upstream/manifest.json evidence/raiden-upstream/bazel-test.log evidence/raiden-upstream/capu-upstream-proof.json 2>/dev/null || true

      - name: Upload upstream baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raiden-upstream-jax-cpu-baseline
          path: evidence/raiden-upstream/
          if-no-files-found: error

      - name: Enforce upstream baseline result
        if: always()
        run: |
          code="${RAIDEN_BAZEL_EXIT_CODE:-1}"
          if [ "$code" -ne 0 ]; then
            echo "Upstream baseline did not complete successfully (Bazel exit code: $code)."
            exit "$code"
          fi
