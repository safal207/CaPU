name: CaPU vCML Precise Trap Privilege Recovery v0.18

on:
  pull_request:
    paths:
      - "rtl/capu_precise_trap_recovery_v18.sv"
      - "rtl/tb/capu_precise_trap_recovery_v18_tb.sv"
      - "formal/capu_precise_trap_recovery_v18_formal.sv"
      - "formal/capu_precise_trap_recovery_v18.sby"
      - "formal/capu_precise_trap_recovery_v18_cover.sby"
      - "tools/vcml_trap_checkpoint_v18.py"
      - "tests/test_vcml_trap_checkpoint_v18.py"
      - "docs/hardware/CAPU_VCML_TRAP_PRIVILEGE_RECOVERY_V18.md"
      - ".github/workflows/vcml-trap-privilege-v18.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trap-privilege-rtl:
    name: Precise trap and privilege trajectory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.18 trap privilege boundary
        run: |
          iverilog -g2012 -o /tmp/capu-vcml-trap-v18 \
            rtl/capu_precise_trap_recovery_v18.sv \
            rtl/tb/capu_precise_trap_recovery_v18_tb.sv
      - name: Run deterministic v0.18 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-vcml-trap-v18 | tee vcml-trap-privilege-v18.log
          grep -F "CAPU_VCML_TRAP_PRIVILEGE_V18_PASS" vcml-trap-privilege-v18.log
          grep -F "prepare_privilege_mutation rejected=1 exact=1" vcml-trap-privilege-v18.log
          grep -F "restore_privilege_mutation rejected=1" vcml-trap-privilege-v18.log
          grep -F "privilege_mismatch rejected=1" vcml-trap-privilege-v18.log
          grep -F "masked_interrupt rejected=1" vcml-trap-privilege-v18.log
          grep -F "exception_priority precise=1" vcml-trap-privilege-v18.log
          grep -F "trap_return exact=1" vcml-trap-privilege-v18.log
          grep -F "recovery_priority runtime_closed=1" vcml-trap-privilege-v18.log
      - name: Run canonical v0.18 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_trap_checkpoint_v18.py | tee vcml-trap-checkpoint-v18-python.log
          grep -F "VCML_TRAP_CHECKPOINT_V18_PASS" vcml-trap-checkpoint-v18-python.log
          grep -F "privilege_change_digest_changed=1" vcml-trap-checkpoint-v18-python.log
          grep -F "trap_context_change_digest_changed=1" vcml-trap-checkpoint-v18-python.log
          grep -F "interrupt_mask_change_digest_changed=1" vcml-trap-checkpoint-v18-python.log
          grep -F "mixed_trap_snapshot_rejected=1" vcml-trap-checkpoint-v18-python.log
      - name: Regress v0.17 deterministic authority path
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-vcml-arch-checkpoint-v17 \
            rtl/capu_arch_checkpoint_binding_v17.sv \
            rtl/tb/capu_arch_checkpoint_binding_v17_tb.sv
          vvp /tmp/capu-vcml-arch-checkpoint-v17 | tee vcml-arch-checkpoint-v17-regression.log
          grep -F "CAPU_VCML_ARCH_CHECKPOINT_V17_PASS" vcml-arch-checkpoint-v17-regression.log
          python3 tests/test_vcml_arch_checkpoint_v17.py | tee vcml-arch-checkpoint-v17-python-regression.log
          grep -F "VCML_ARCH_CHECKPOINT_V17_PASS" vcml-arch-checkpoint-v17-python-regression.log
      - name: Capture executable evidence hashes
        run: |
          sha256sum \
            rtl/capu_precise_trap_recovery_v18.sv \
            rtl/tb/capu_precise_trap_recovery_v18_tb.sv \
            tools/vcml_trap_checkpoint_v18.py \
            tests/test_vcml_trap_checkpoint_v18.py \
            vcml-trap-privilege-v18.log \
            vcml-trap-checkpoint-v18-python.log \
            vcml-arch-checkpoint-v17-regression.log \
            vcml-arch-checkpoint-v17-python-regression.log > vcml-trap-privilege-v18.sha256
          cat vcml-trap-privilege-v18.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v18-trap-privilege-evidence
          path: |
            vcml-trap-privilege-v18.log
            vcml-trap-checkpoint-v18-python.log
            vcml-arch-checkpoint-v17-regression.log
            vcml-arch-checkpoint-v17-python-regression.log
            vcml-trap-privilege-v18.sha256

  trap-privilege-formal:
    name: Bounded v0.18 precise trap proof
    needs: trap-privilege-rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.18 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-vcml-trap-v18-formal
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-trap-v18-formal/safety-work \
            formal/capu_precise_trap_recovery_v18.sby 2>&1 | tee target/capu-vcml-trap-v18-formal/formal.log
          grep -q 'DONE (PASS' target/capu-vcml-trap-v18-formal/formal.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-trap-v18-formal/formal.log
      - name: Prove v0.18 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-trap-v18-formal/cover-work \
            formal/capu_precise_trap_recovery_v18_cover.sby 2>&1 | tee target/capu-vcml-trap-v18-formal/cover.log
          grep -q 'DONE (PASS' target/capu-vcml-trap-v18-formal/cover.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-trap-v18-formal/cover.log
          test "$(find target/capu-vcml-trap-v18-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.17 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-trap-v18-formal/v17-safety-work \
            formal/capu_arch_checkpoint_binding_v17.sby 2>&1 | tee target/capu-vcml-trap-v18-formal/v17-formal.log
          grep -q 'DONE (PASS' target/capu-vcml-trap-v18-formal/v17-formal.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-trap-v18-formal/v17-formal.log
      - name: Seal v0.18 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path('target/capu-vcml-trap-v18-formal')
          safety=(root/'formal.log').read_text(errors='replace')
          cover=(root/'cover.log').read_text(errors='replace')
          v17=(root/'v17-formal.log').read_text(errors='replace')
          for label, log in [('v0.18 safety',safety),('v0.18 cover',cover),('v0.17 safety regression',v17)]:
              if 'DONE (PASS' not in log or 'DONE (ERROR' in log:
                  raise SystemExit(f'{label} not PASS')
          inputs=[Path(x) for x in [
            'rtl/capu_precise_trap_recovery_v18.sv',
            'formal/capu_precise_trap_recovery_v18_formal.sv',
            'formal/capu_precise_trap_recovery_v18.sby',
            'formal/capu_precise_trap_recovery_v18_cover.sby',
            'tools/vcml_trap_checkpoint_v18.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          witnesses=list((root/'cover-work').rglob('trace*.vcd'))
          proof={
            'schema':'capu.hardware.precise-trap-privilege-recovery-formal-proof.v0.18',
            'result':'PASS','depth':26,'cover_depth':30,'cover_witnesses':len(witnesses),
            'solver':'z3','v0_17_safety_regression':'PASS',
            'formal_instance':{
              'checkpoint_ref_width':3,'checkpoint_epoch_width':3,
              'checkpoint_commitment_width':4,'base_payload_width':12,
              'pc_width':4,'privilege_width':2,'cause_width':3},
            'invariants':[
              'RESTORE_ACCEPT => SNAPSHOT == ANCHOR == EXACT_REPACKED_TRAP_STATE',
              'FOREIGN_TRAP_OR_PRIVILEGE_STATE => RESTORE_REJECT',
              'PRIVILEGE_MISMATCH => NORMAL_STEP_REJECT',
              'MASKED_INTERRUPT => NO_INTERRUPT_TRAP_ENTRY',
              'EXCEPTION_AND_INTERRUPT => EXCEPTION_PRIORITY',
              'TRAP_ENTER => SAVE_RETURN_CONTEXT && NO_VISIBLE_EFFECT',
              'PRE_TRAP_SPECULATION => DISCARDED_ON_TRAP',
              'TRAP_RETURN => RECORDED_PC_AND_PRIVILEGE',
              'RECOVERY_OR_RESTORE => NO_CHECKPOINT_AUTHORITY_TRANSITION'],
            'claim_boundary':'bounded reduced-width one-trap privilege recovery model. No full ISA/CSR semantics, nested traps, MMU/TLB, NMI/debug, production speculation, RTL SHA-256, durable media, multicore or unbounded correctness are claimed.',
            'formal_input_sha256':h.hexdigest(),
            'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),
            'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),
            'v0_17_regression_log_sha256':hashlib.sha256(v17.encode()).hexdigest(),
            'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),
            'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),
            'z3_version':subprocess.check_output(['z3','--version'],text=True).strip()}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v18-trap-privilege-formal-evidence
          path: |
            target/capu-vcml-trap-v18-formal/formal.log
            target/capu-vcml-trap-v18-formal/cover.log
            target/capu-vcml-trap-v18-formal/v17-formal.log
            target/capu-vcml-trap-v18-formal/formal-proof.json
            target/capu-vcml-trap-v18-formal/safety-work/
            target/capu-vcml-trap-v18-formal/cover-work/
          if-no-files-found: warn
