<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ASTRA–CaPU v1.0 reference architecture</title>
  <desc id="desc">A three-axis causal execution architecture connecting intent, memory, policy, observability and world interfaces to ASTRA transition mapping, CaPU verification, accelerator execution and physical effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a16"/><stop offset="0.55" stop-color="#071126"/><stop offset="1" stop-color="#04070f"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#ff5ecb"/><stop offset="0.42" stop-color="#7b35c7"/><stop offset="1" stop-color="#17102e"/></radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6ba7"/><stop offset="1" stop-color="#7b245e"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b66cff"/><stop offset="1" stop-color="#3b1d78"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb259"/><stop offset="1" stop-color="#7a3e16"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a9ff"/><stop offset="1" stop-color="#173a8d"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ee6ba"/><stop offset="1" stop-color="#12624f"/></linearGradient>
    <linearGradient id="astra" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17c97a"/><stop offset="1" stop-color="#073d2f"/></linearGradient>
    <linearGradient id="capu" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#397dff"/><stop offset="1" stop-color="#16265b"/></linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7848d8"/><stop offset="1" stop-color="#241443"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/></filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52d6ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63f3a3"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c177ff"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1px;fill:#56d6ff}.subtitle{font:600 21px Inter,Segoe UI,Arial,sans-serif;fill:#b8d8ff}.h2{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#f5f8ff;letter-spacing:.3px}.h3{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#f5f8ff}.body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#c8d6eb}.small{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#b9c8dc}.tiny{font:400 10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#b7e8cc}.axis{font:700 15px Inter,Segoe UI,Arial,sans-serif}.panel{fill:#07101f;stroke:#285076;stroke-width:1.2}.wire{fill:none;stroke:#2b6c98;stroke-width:1.2;opacity:.55}.node{fill:#091a31;stroke:#52d6ff;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".22"><circle cx="800" cy="390" r="355" fill="none" stroke="#445eaa" stroke-dasharray="7 12"/><circle cx="800" cy="390" r="290" fill="none" stroke="#2c476f" stroke-dasharray="3 11"/><path d="M260 390H1340M800 70V760" stroke="#1c3e62"/></g>
  <rect x="20" y="20" width="410" height="124" rx="14" class="panel"/><text x="36" y="62" class="title">ASTRA–CaPU v1.0</text><text x="36" y="93" class="subtitle">REFERENCE ARCHITECTURE</text><text x="36" y="119" class="body">Causal execution control for reliable autonomous intelligence</text>
  <rect x="20" y="162" width="245" height="265" rx="14" class="panel"/><text x="38" y="191" class="h2">THREE ARCHITECTURAL AXES</text>
  <circle cx="48" cy="230" r="16" fill="#0e4e7d"/><text x="48" y="235" text-anchor="middle" class="h3">S</text><text x="76" y="225" class="axis" fill="#56d6ff">SPACE / STATE</text><text x="76" y="246" class="body">Where is the system?</text><text x="76" y="265" class="small">nodes · relations · structure</text>
  <circle cx="48" cy="307" r="16" fill="#155f3d"/><text x="48" y="312" text-anchor="middle" class="h3">T</text><text x="76" y="302" class="axis" fill="#63f3a3">TIME / TRANSITION</text><text x="76" y="323" class="body">How does state evolve?</text><text x="76" y="342" class="small">order · epochs · recovery</text>
  <circle cx="48" cy="383" r="16" fill="#54246f"/><text x="48" y="388" text-anchor="middle" class="h3">C</text><text x="76" y="378" class="axis" fill="#ce7aff">CAUSALITY / PROOF</text><text x="76" y="399" class="body">Why did it happen?</text><text x="76" y="418" class="small">authority · evidence · receipts</text>
  <g filter="url(#shadow)"><ellipse cx="800" cy="215" rx="95" ry="170" fill="url(#pink)" opacity=".88" stroke="#ff9aca"/><ellipse cx="635" cy="255" rx="90" ry="165" fill="url(#violet)" opacity=".82" stroke="#d3a6ff" transform="rotate(-42 635 360)"/><ellipse cx="965" cy="255" rx="90" ry="165" fill="url(#orange)" opacity=".82" stroke="#ffc983" transform="rotate(42 965 360)"/><ellipse cx="585" cy="410" rx="88" ry="155" fill="url(#blue)" opacity=".84" stroke="#7bc1ff" transform="rotate(-82 585 410)"/><ellipse cx="1015" cy="410" rx="88" ry="155" fill="url(#green)" opacity=".84" stroke="#83f6d5" transform="rotate(82 1015 410)"/></g>
  <g text-anchor="middle"><text x="800" y="145" class="h2">INTENT LAYER</text><text x="800" y="170" class="body">goals · plans · policies</text><text x="800" y="190" class="body">constraints · intent commitment</text><text x="620" y="244" class="h2">MEMORY TRUTH</text><text x="620" y="267" class="body">provenance · evidence</text><text x="620" y="287" class="body">confidence · epoch</text><text x="980" y="244" class="h2">POLICY &amp; RISK</text><text x="980" y="267" class="body">permissions · limits</text><text x="980" y="287" class="body">safety · governance</text><text x="552" y="401" class="h2">OBSERVABILITY</text><text x="552" y="424" class="body">traces · metrics</text><text x="552" y="444" class="body">fault injection · debug</text><text x="1048" y="401" class="h2">WORLD INTERFACE</text><text x="1048" y="424" class="body">APIs · robots · payments</text><text x="1048" y="444" class="body">sensors · external effects</text></g>
  <circle cx="800" cy="340" r="105" fill="url(#core)" stroke="#f1a6ff" stroke-width="2" filter="url(#glow)"/><text x="800" y="309" text-anchor="middle" class="h2">CAUSAL DNA</text><text x="800" y="331" text-anchor="middle" class="h3">STATE GENOME</text><text x="800" y="357" text-anchor="middle" class="body">identity · history · transitions</text><text x="800" y="377" text-anchor="middle" class="body">inheritance · allowed futures</text>
  <path d="M800 445V474" stroke="#63f3a3" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <g filter="url(#shadow)"><ellipse cx="800" cy="500" rx="245" ry="46" fill="#0f8a5f" opacity=".7" stroke="#65efaf"/><rect x="555" y="500" width="490" height="100" fill="url(#astra)" stroke="#65efaf"/><ellipse cx="800" cy="600" rx="245" ry="46" fill="#063d31" stroke="#65efaf"/></g><text x="800" y="526" text-anchor="middle" class="h2">ASTRA CORE — TRANSITION MAP</text><text x="800" y="550" text-anchor="middle" class="body">state graph · possible paths · conflict detection</text><text x="800" y="572" text-anchor="middle" class="body">selects candidate transitions; does not grant execution authority</text>
  <path d="M800 606V624" stroke="#56d6ff" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <g filter="url(#shadow)"><ellipse cx="800" cy="650" rx="245" ry="46" fill="#2c65d4" opacity=".75" stroke="#78b8ff"/><rect x="555" y="650" width="490" height="105" fill="url(#capu)" stroke="#78b8ff"/><ellipse cx="800" cy="755" rx="245" ry="46" fill="#152858" stroke="#78b8ff"/></g><text x="800" y="676" text-anchor="middle" class="h2">CaPU CORE — CAUSAL EXECUTION UNIT</text><text x="800" y="701" text-anchor="middle" class="body">authority engine · epoch manager · checkpoint manager</text><text x="800" y="723" text-anchor="middle" class="body">recovery engine · effect/transaction manager · proof engine</text>
  <path d="M800 762V780" stroke="#c177ff" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <g filter="url(#shadow)"><ellipse cx="800" cy="806" rx="245" ry="44" fill="#7542ce" opacity=".7" stroke="#c498ff"/><rect x="555" y="806" width="490" height="66" fill="url(#fabric)" stroke="#c498ff"/><ellipse cx="800" cy="872" rx="245" ry="44" fill="#261445" stroke="#c498ff"/></g><text x="800" y="833" text-anchor="middle" class="h2">EXECUTION FABRIC</text><text x="800" y="857" text-anchor="middle" class="body">accelerators · DMA · memory · network · I/O</text>
  <path d="M800 878V902" stroke="#e1b8ff" stroke-width="3" marker-end="url(#arrowPurple)"/><rect x="620" y="912" width="360" height="56" rx="14" fill="#0a1322" stroke="#8b72bd"/><text x="800" y="937" text-anchor="middle" class="h2">PHYSICAL REALITY</text><text x="800" y="958" text-anchor="middle" class="small">effects · actuators · environment · people · systems</text>
  <path d="M305 560H495" stroke="#52d6ff" stroke-width="2" marker-end="url(#arrowCyan)"/><text x="305" y="540" class="axis" fill="#56d6ff">SPACE AXIS / STATE</text><path d="M1095 560H1285" stroke="#63f3a3" stroke-width="2" marker-end="url(#arrowGreen)"/><text x="1095" y="540" class="axis" fill="#63f3a3">TIME AXIS / TRANSITION</text><path d="M1095 720H1285" stroke="#c177ff" stroke-width="2" marker-end="url(#arrowPurple)"/><text x="1095" y="700" class="axis" fill="#ce7aff">CAUSALITY AXIS / PROOF</text>
  <g transform="translate(1120 735)"><circle cx="0" cy="0" r="15" fill="#4a2370" stroke="#d29cff"/><circle cx="75" cy="0" r="15" fill="#784316" stroke="#ffc06e"/><circle cx="150" cy="0" r="15" fill="#154c79" stroke="#62c8ff"/><circle cx="225" cy="0" r="15" fill="#155f3d" stroke="#67f2a4"/><path d="M17 0H57M92 0H132M167 0H207" stroke="#96a9c5" marker-end="url(#arrowCyan)"/><text x="0" y="34" text-anchor="middle" class="small">cause</text><text x="75" y="34" text-anchor="middle" class="small">action</text><text x="150" y="34" text-anchor="middle" class="small">effect</text><text x="225" y="34" text-anchor="middle" class="small">proof</text></g>
  <rect x="1305" y="20" width="275" height="600" rx="14" class="panel"/><text x="1442" y="54" text-anchor="middle" class="h2">END-TO-END CAUSAL FLOW</text>
  <g class="body"><circle cx="1335" cy="90" r="14" fill="#7b245e"/><text x="1335" y="95" text-anchor="middle" class="h3">1</text><text x="1362" y="86" class="h3" fill="#ff8bb8">INTENT</text><text x="1362" y="105" class="small">goal and constraints</text><circle cx="1335" cy="148" r="14" fill="#784316"/><text x="1335" y="153" text-anchor="middle" class="h3">2</text><text x="1362" y="144" class="h3" fill="#ffb96f">REASONING</text><text x="1362" y="163" class="small">plan candidate action</text><circle cx="1335" cy="206" r="14" fill="#3b1d78"/><text x="1335" y="211" text-anchor="middle" class="h3">3</text><text x="1362" y="202" class="h3" fill="#c8a5ff">MEMORY + CONTEXT</text><text x="1362" y="221" class="small">load trusted evidence</text><circle cx="1335" cy="264" r="14" fill="#12624f"/><text x="1335" y="269" text-anchor="middle" class="h3">4</text><text x="1362" y="260" class="h3" fill="#72f0c4">ASTRA MAP</text><text x="1362" y="279" class="small">enumerate state paths</text><circle cx="1335" cy="322" r="14" fill="#173a8d"/><text x="1335" y="327" text-anchor="middle" class="h3">5</text><text x="1362" y="318" class="h3" fill="#79baff">CaPU VERIFY</text><text x="1362" y="337" class="small">authority, epoch, safety</text><circle cx="1335" cy="380" r="14" fill="#4a2370"/><text x="1335" y="385" text-anchor="middle" class="h3">6</text><text x="1362" y="376" class="h3" fill="#d49cff">EXECUTE</text><text x="1362" y="395" class="small">accelerator or system</text><circle cx="1335" cy="438" r="14" fill="#154c79"/><text x="1335" y="443" text-anchor="middle" class="h3">7</text><text x="1362" y="434" class="h3" fill="#63ccff">OBSERVE</text><text x="1362" y="453" class="small">capture real effect</text><circle cx="1335" cy="496" r="14" fill="#54246f"/><text x="1335" y="501" text-anchor="middle" class="h3">8</text><text x="1362" y="492" class="h3" fill="#d49cff">PROOF RECEIPT</text><text x="1362" y="511" class="small">bind effect to authority</text><circle cx="1335" cy="554" r="14" fill="#155f3d"/><text x="1335" y="559" text-anchor="middle" class="h3">9</text><text x="1362" y="550" class="h3" fill="#72f0a4">MEMORY UPDATE</text><text x="1362" y="569" class="small">write new state DNA</text></g><path d="M1335 106V132M1335 164V190M1335 222V248M1335 280V306M1335 338V364M1335 396V422M1335 454V480M1335 512V538" stroke="#4d708e" stroke-width="2"/>
  <rect x="20" y="447" width="245" height="155" rx="14" class="panel"/><text x="38" y="477" class="h2">CORE PRINCIPLE</text><text x="38" y="507" class="body">Every consequential action must be:</text><text x="38" y="535" class="h3" fill="#65f0a5">CAUSED → AUTHORIZED → EXECUTED</text><text x="38" y="558" class="h3" fill="#65f0a5">→ OBSERVED → LEARNED</text><text x="38" y="584" class="small">No gaps. No ghost authority. Uncertainty fails closed.</text>
  <rect x="20" y="620" width="245" height="235" rx="14" class="panel"/><text x="38" y="650" class="h2">STATE DNA — EXAMPLE</text><text x="38" y="678" class="tiny">state_id: payment:123</text><text x="38" y="697" class="tiny">origin: verified invoice</text><text x="38" y="716" class="tiny">epoch: 55</text><text x="38" y="735" class="tiny">previous: unpaid</text><text x="38" y="754" class="tiny">transition: unpaid → paid</text><text x="38" y="773" class="tiny">effect: bank-confirmed</text><text x="38" y="792" class="tiny">receipt: sha256(...)</text><text x="38" y="811" class="tiny">allowed_next: refund | settle</text><text x="38" y="834" class="small">A state carries identity, history, authority and allowed futures.</text>
  <rect x="280" y="900" width="305" height="78" rx="14" class="panel"/><text x="300" y="928" class="h2">VERIFIED FOUNDATIONS</text><text x="300" y="952" class="small">checkpoint recovery · precise effects · DMA uncertainty</text><text x="300" y="970" class="small">queue identity · epoch ABA protection · stale evidence quarantine</text>
  <rect x="1015" y="805" width="565" height="173" rx="14" class="panel"/><text x="1038" y="836" class="h2">WHAT THIS IS — AND IS NOT</text><text x="1038" y="864" class="body">✓ A formally tested control-plane architecture for causal continuity and effect authority.</text><text x="1038" y="889" class="body">✓ A candidate coprocessor/runtime boundary around AI accelerators and agents.</text><text x="1038" y="914" class="body">✕ Not a tensor core, full TPU/GPU replacement, tape-out, or production silicon.</text><text x="1038" y="939" class="body">Next gate: real accelerator integration, fault injection, overhead and FPGA evidence.</text><text x="1038" y="963" class="small">Positioning: “verifiable execution and recovery layer,” not “finished AI processor.”</text>
</svg>