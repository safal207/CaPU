name: CaPU vCML Multi-Beat DMA Recovery v0.29

on:
  pull_request:
    paths:
      - 'rtl/capu_multibeat_dma_recovery_v29.sv'
      - 'rtl/tb/capu_multibeat_dma_recovery_v29_tb.sv'
      - 'tools/vcml_multibeat_dma_checkpoint_v29.py'
      - 'tests/test_vcml_multibeat_dma_checkpoint_v29.py'
      - 'formal/capu_multibeat_dma_recovery_v29*'
      - '.github/workflows/vcml-multibeat-dma-recovery-v29.yml'
      - 'docs/hardware/CAPU_VCML_MULTIBEAT_DMA_RECOVERY_V29.md'

jobs:
  deterministic:
    name: Partial multi-beat DMA deterministic trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.29
        run: iverilog -g2012 -o /tmp/capu-v29 rtl/capu_multibeat_dma_recovery_v29.sv rtl/tb/capu_multibeat_dma_recovery_v29_tb.sv
      - name: Run deterministic v0.29 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v29 | tee vcml-multibeat-dma-v29.log
          grep -F 'CAPU_VCML_MULTIBEAT_DMA_RECOVERY_V29_PASS' vcml-multibeat-dma-v29.log
          grep -F 'partial_checkpoint beats=COMMITTED,COMMITTED,UNKNOWN,UNISSUED' vcml-multibeat-dma-v29.log
          grep -F 'partial_restore committed_prefix_replay_blocked=1 unresolved_beat_requires_evidence=1 tail_blocked=1' vcml-multibeat-dma-v29.log
          grep -F 'negative_evidence beat=2 durable_negative_receipt=1 replay_authority=1 tail_blocked=1' vcml-multibeat-dma-v29.log
          grep -F 'stale_partial_restore negative_receipt_wins=1 beat2=NOT_COMMITTED replay_authority=1' vcml-multibeat-dma-v29.log
          grep -F 'retry_crash_restore current_issue_witness_wins=1 beat2=UNKNOWN replay_authority=0' vcml-multibeat-dma-v29.log
          grep -F 'prefix_complete beat0_2_committed=1 beat3_authority=1' vcml-multibeat-dma-v29.log
          grep -F 'late_stale_partial_restore completion_receipts_win=1 all_beats=COMMITTED replay_bitmap=0000' vcml-multibeat-dma-v29.log
      - name: Run canonical v0.29 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_multibeat_dma_checkpoint_v29.py | tee vcml-multibeat-dma-checkpoint-v29-python.log
          grep -F 'VCML_MULTIBEAT_DMA_CHECKPOINT_V29_PASS' vcml-multibeat-dma-checkpoint-v29-python.log
          grep -F 'committed_prefix_replay_mixed_state_rejected=1' vcml-multibeat-dma-checkpoint-v29-python.log
          grep -F 'foreign_receipt_identity_mixed_state_rejected=1' vcml-multibeat-dma-checkpoint-v29-python.log
          grep -F 'stale_negative_receipt_survives_retry_mixed_state_rejected=1' vcml-multibeat-dma-checkpoint-v29-python.log
          grep -F 'partial_checkpoint_state_substitution_rejected=1' vcml-multibeat-dma-checkpoint-v29-python.log
      - name: Regress v0.28 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v28 rtl/capu_durable_negative_completion_v28.sv rtl/tb/capu_durable_negative_completion_v28_tb.sv
          vvp /tmp/capu-v28 | tee vcml-durable-negative-v28-regression.log
          grep -F 'CAPU_VCML_DURABLE_NEGATIVE_COMPLETION_V28_PASS' vcml-durable-negative-v28-regression.log
          python3 tests/test_vcml_durable_negative_checkpoint_v28.py | tee vcml-durable-negative-checkpoint-v28-python-regression.log
          grep -F 'VCML_DURABLE_NEGATIVE_CHECKPOINT_V28_PASS' vcml-durable-negative-checkpoint-v28-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_multibeat_dma_recovery_v29.sv rtl/tb/capu_multibeat_dma_recovery_v29_tb.sv tools/vcml_multibeat_dma_checkpoint_v29.py tests/test_vcml_multibeat_dma_checkpoint_v29.py vcml-multibeat-dma-v29.log vcml-multibeat-dma-checkpoint-v29-python.log vcml-durable-negative-v28-regression.log vcml-durable-negative-checkpoint-v28-python-regression.log > vcml-multibeat-dma-v29.sha256
          cat vcml-multibeat-dma-v29.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v29-multibeat-dma-evidence
          path: |
            vcml-multibeat-dma-v29.log
            vcml-multibeat-dma-checkpoint-v29-python.log
            vcml-durable-negative-v28-regression.log
            vcml-durable-negative-checkpoint-v28-python-regression.log
            vcml-multibeat-dma-v29.sha256

  formal:
    name: Bounded v0.29 partial multi-beat DMA proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.29 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v29-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v29-formal/safety-work formal/capu_multibeat_dma_recovery_v29.sby 2>&1 | tee target/capu-v29-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v29-formal/formal.log
      - name: Prove v0.29 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v29-formal/cover-work formal/capu_multibeat_dma_recovery_v29_cover.sby 2>&1 | tee target/capu-v29-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v29-formal/cover.log
          test "$(find target/capu-v29-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.28 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v29-formal/v28-safety-work formal/capu_durable_negative_completion_v28.sby 2>&1 | tee target/capu-v29-formal/v28-formal.log
          grep -q 'DONE (PASS' target/capu-v29-formal/v28-formal.log
      - name: Seal v0.29 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v29-formal')
          safety=(root/'formal.log').read_text(errors='replace'); cover=(root/'cover.log').read_text(errors='replace'); v28=(root/'v28-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_multibeat_dma_recovery_v29.sv','formal/capu_multibeat_dma_recovery_v29_formal.sv','formal/capu_multibeat_dma_recovery_v29.sby','formal/capu_multibeat_dma_recovery_v29_cover.sby','tools/vcml_multibeat_dma_checkpoint_v29.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.multibeat-dma-recovery-formal-proof.v0.29','result':'PASS','proof_method':'bounded model checking','depth':18,'cover_depth':36,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'formal_identity_width_bits':2,'beat_count':4,'v0_28_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_28_regression_log_sha256':hashlib.sha256(v28.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width one-command ordered four-beat DMA transaction with per-beat issue/negative/completion authority; no production transport, arbitrary burst length, or out-of-order fragment semantics'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v29-multibeat-dma-formal-evidence
          path: |
            target/capu-v29-formal/formal.log
            target/capu-v29-formal/cover.log
            target/capu-v29-formal/v28-formal.log
            target/capu-v29-formal/formal-proof.json
            target/capu-v29-formal/safety-work/
            target/capu-v29-formal/cover-work/
