name: CaPU vCML Architectural Checkpoint Binding v0.17

on:
  pull_request:
    paths:
      - "rtl/capu_arch_checkpoint_binding_v17.sv"
      - "rtl/tb/capu_arch_checkpoint_binding_v17_tb.sv"
      - "formal/capu_arch_checkpoint_binding_v17_formal.sv"
      - "formal/capu_arch_checkpoint_binding_v17.sby"
      - "formal/capu_arch_checkpoint_binding_v17_cover.sby"
      - "tools/vcml_arch_checkpoint_v17.py"
      - "tests/test_vcml_arch_checkpoint_v17.py"
      - "docs/hardware/CAPU_VCML_ARCH_CHECKPOINT_BINDING_V17.md"
      - "docs/hardware/CAPU_VCML_ARCH_RESUME_V16.md"
      - ".github/workflows/vcml-arch-checkpoint-v17.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-checkpoint-rtl:
    name: Complete architectural checkpoint trajectory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.17 authority boundary
        run: |
          iverilog -g2012 -o /tmp/capu-vcml-arch-checkpoint-v17 \
            rtl/capu_arch_checkpoint_binding_v17.sv \
            rtl/tb/capu_arch_checkpoint_binding_v17_tb.sv
      - name: Run deterministic v0.17 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-vcml-arch-checkpoint-v17 | tee vcml-arch-checkpoint-v17.log
          grep -F "CAPU_VCML_ARCH_CHECKPOINT_V17_PASS" vcml-arch-checkpoint-v17.log
          grep -F "prepare_arch_mutation rejected=1 exact=1" vcml-arch-checkpoint-v17.log
          grep -F "persistence_arch_mutation rejected=1 exact=1" vcml-arch-checkpoint-v17.log
          grep -F "anchor_arch_mutation rejected=1 committed=1" vcml-arch-checkpoint-v17.log
          grep -F "mixed_snapshot rejected=1" vcml-arch-checkpoint-v17.log
          grep -F "recovery_priority enforced=1" vcml-arch-checkpoint-v17.log
      - name: Run canonical v0.17 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_arch_checkpoint_v17.py | tee vcml-arch-checkpoint-v17-python.log
          grep -F "VCML_ARCH_CHECKPOINT_V17_PASS" vcml-arch-checkpoint-v17-python.log
          grep -F "pc_change_digest_changed=1" vcml-arch-checkpoint-v17-python.log
          grep -F "gpr_change_digest_changed=1" vcml-arch-checkpoint-v17-python.log
          grep -F "status_change_digest_changed=1" vcml-arch-checkpoint-v17-python.log
          grep -F "recovery_epoch_change_digest_changed=1" vcml-arch-checkpoint-v17-python.log
          grep -F "causal_change_digest_changed=1" vcml-arch-checkpoint-v17-python.log
          grep -F "mixed_snapshot_rejected=1" vcml-arch-checkpoint-v17-python.log
      - name: Regress v0.16 deterministic resume
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-vcml-arch-resume-v16 \
            rtl/capu_store_buffer.sv \
            rtl/capu_ctag_validator.sv \
            rtl/capu_seal_controller.sv \
            rtl/capu_causal_head_controller.sv \
            rtl/capu_vcml_store_buffer.sv \
            rtl/capu_replay_recovery_guard.sv \
            rtl/capu_vcml_store_buffer_v15.sv \
            rtl/capu_vcml_store_buffer_v16.sv \
            rtl/tb/capu_vcml_arch_resume_v16_tb.sv
          vvp /tmp/capu-vcml-arch-resume-v16 | tee vcml-arch-resume-v16-regression.log
          grep -F "CAPU_VCML_ARCH_RESUME_V16_PASS" vcml-arch-resume-v16-regression.log
      - name: Capture executable evidence hashes
        run: |
          sha256sum \
            rtl/capu_arch_checkpoint_binding_v17.sv \
            rtl/tb/capu_arch_checkpoint_binding_v17_tb.sv \
            tools/vcml_arch_checkpoint_v17.py \
            tests/test_vcml_arch_checkpoint_v17.py \
            vcml-arch-checkpoint-v17.log \
            vcml-arch-checkpoint-v17-python.log \
            vcml-arch-resume-v16-regression.log > vcml-arch-checkpoint-v17.sha256
          cat vcml-arch-checkpoint-v17.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v17-arch-checkpoint-evidence
          path: |
            vcml-arch-checkpoint-v17.log
            vcml-arch-checkpoint-v17-python.log
            vcml-arch-resume-v16-regression.log
            vcml-arch-checkpoint-v17.sha256

  arch-checkpoint-formal:
    name: Bounded v0.17 complete checkpoint proof
    needs: arch-checkpoint-rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.17 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-vcml-arch-checkpoint-formal
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-arch-checkpoint-formal/safety-work \
            formal/capu_arch_checkpoint_binding_v17.sby 2>&1 | tee target/capu-vcml-arch-checkpoint-formal/formal.log
          grep -q 'DONE (PASS' target/capu-vcml-arch-checkpoint-formal/formal.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-arch-checkpoint-formal/formal.log
      - name: Prove v0.17 positive and negative paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-arch-checkpoint-formal/cover-work \
            formal/capu_arch_checkpoint_binding_v17_cover.sby 2>&1 | tee target/capu-vcml-arch-checkpoint-formal/cover.log
          grep -q 'DONE (PASS' target/capu-vcml-arch-checkpoint-formal/cover.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-arch-checkpoint-formal/cover.log
          test "$(find target/capu-vcml-arch-checkpoint-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 4
      - name: Regress v0.16 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-vcml-arch-checkpoint-formal/v16-safety-work \
            formal/capu_vcml_arch_resume_v16.sby 2>&1 | tee target/capu-vcml-arch-checkpoint-formal/v16-formal.log
          grep -q 'DONE (PASS' target/capu-vcml-arch-checkpoint-formal/v16-formal.log
          ! grep -q 'DONE (ERROR' target/capu-vcml-arch-checkpoint-formal/v16-formal.log
      - name: Seal v0.17 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path('target/capu-vcml-arch-checkpoint-formal')
          safety=(root/'formal.log').read_text(errors='replace')
          cover=(root/'cover.log').read_text(errors='replace')
          v16=(root/'v16-formal.log').read_text(errors='replace')
          for label, log in [('v0.17 safety',safety),('v0.17 cover',cover),('v0.16 safety regression',v16)]:
              if 'DONE (PASS' not in log or 'DONE (ERROR' in log:
                  raise SystemExit(f'{label} not PASS')
          inputs=[Path(x) for x in [
            'rtl/capu_arch_checkpoint_binding_v17.sv',
            'formal/capu_arch_checkpoint_binding_v17_formal.sv',
            'formal/capu_arch_checkpoint_binding_v17.sby',
            'formal/capu_arch_checkpoint_binding_v17_cover.sby',
            'tools/vcml_arch_checkpoint_v17.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          witnesses=list((root/'cover-work').rglob('trace*.vcd'))
          proof={
            'schema':'capu.hardware.architectural-checkpoint-content-formal-proof.v0.17',
            'result':'PASS','depth':24,'cover_depth':28,'cover_witnesses':len(witnesses),
            'solver':'z3','v0_16_safety_regression':'PASS',
            'formal_instance':{
              'checkpoint_ref_width':3,'checkpoint_epoch_width':3,
              'checkpoint_commitment_width':4,'arch_epoch_width':2,
              'pc_width':3,'gpr_width':3,'gpr_count':4,
              'transition_id_width':3,'authorization_ref_width':3,
              'spent_authorization_slots':2},
            'invariants':[
              'PREPARE_ACCEPT => CANDIDATE_PAYLOAD == LIVE_PAYLOAD',
              'PERSIST_ACCEPT => PERSISTED_PAYLOAD == REQUEST_PAYLOAD',
              'AUTHORITY_COMMIT => ACK_PAYLOAD == REQUEST_PAYLOAD',
              'RESTORE_ACCEPT => VERIFIED_SNAPSHOT_PAYLOAD == ANCHOR_PAYLOAD',
              'MIXED_SNAPSHOT => NO_RESTORE_ACCEPT',
              'RECOVERY_OR_RESTORE => NO_CONCURRENT_AUTHORITY_TRANSITION',
              'RECOVERY_OR_RESTORE => PENDING_AUTHORITY_DISCARDED',
              'RESTORE_ACCEPT => NEXT_RECOVERED_PAYLOAD == ACCEPTED_PAYLOAD'],
            'claim_boundary':'bounded reduced-width proof that one complete minimal architectural + causal + replay checkpoint payload is preserved through prepare, persistence, authority commit and anchored restore. SHA-256/canonical-verifier trust, durable media, full CPU state, exceptions/interrupts/privilege, production widths and unbounded correctness are not claimed.',
            'formal_input_sha256':h.hexdigest(),
            'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),
            'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),
            'v0_16_regression_log_sha256':hashlib.sha256(v16.encode()).hexdigest(),
            'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),
            'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),
            'z3_version':subprocess.check_output(['z3','--version'],text=True).strip()}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v17-arch-checkpoint-formal-evidence
          path: |
            target/capu-vcml-arch-checkpoint-formal/formal.log
            target/capu-vcml-arch-checkpoint-formal/cover.log
            target/capu-vcml-arch-checkpoint-formal/v16-formal.log
            target/capu-vcml-arch-checkpoint-formal/formal-proof.json
            target/capu-vcml-arch-checkpoint-formal/safety-work/
            target/capu-vcml-arch-checkpoint-formal/cover-work/
          if-no-files-found: warn
