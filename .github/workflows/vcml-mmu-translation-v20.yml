name: CaPU vCML MMU Translation Recovery v0.20

on:
  pull_request:
    paths:
      - "rtl/capu_mmu_translation_recovery_v20.sv"
      - "rtl/tb/capu_mmu_translation_recovery_v20_tb.sv"
      - "formal/capu_mmu_translation_recovery_v20_formal.sv"
      - "formal/capu_mmu_translation_recovery_v20.sby"
      - "formal/capu_mmu_translation_recovery_v20_cover.sby"
      - "tools/vcml_mmu_checkpoint_v20.py"
      - "tests/test_vcml_mmu_checkpoint_v20.py"
      - "docs/hardware/CAPU_VCML_MMU_TRANSLATION_RECOVERY_V20.md"
      - ".github/workflows/vcml-mmu-translation-v20.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mmu-rtl:
    name: Exact memory-view trajectory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.20
        run: |
          iverilog -g2012 -o /tmp/capu-v20 \
            rtl/capu_mmu_translation_recovery_v20.sv \
            rtl/tb/capu_mmu_translation_recovery_v20_tb.sv
      - name: Run deterministic v0.20 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v20 | tee vcml-mmu-translation-v20.log
          grep -F "CAPU_VCML_MMU_TRANSLATION_V20_PASS" vcml-mmu-translation-v20.log
          grep -F "translation_hit exact=1" vcml-mmu-translation-v20.log
          grep -F "permission_fault precise=1 speculation_killed=1" vcml-mmu-translation-v20.log
          grep -F "foreign_translation_root rejected=1" vcml-mmu-translation-v20.log
          grep -F "foreign_asid rejected=1" vcml-mmu-translation-v20.log
          grep -F "stale_translation_epoch rejected=1" vcml-mmu-translation-v20.log
          grep -F "foreign_fault_context rejected=1" vcml-mmu-translation-v20.log
          grep -F "stale_candidate rejected=1" vcml-mmu-translation-v20.log
          grep -F "checkpoint_authority exact_memory_view=1" vcml-mmu-translation-v20.log
      - name: Run canonical v0.20 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_mmu_checkpoint_v20.py | tee vcml-mmu-checkpoint-v20-python.log
          grep -F "VCML_MMU_CHECKPOINT_V20_PASS" vcml-mmu-checkpoint-v20-python.log
          grep -F "root_change_digest_changed=1" vcml-mmu-checkpoint-v20-python.log
          grep -F "asid_change_digest_changed=1" vcml-mmu-checkpoint-v20-python.log
          grep -F "translation_epoch_change_digest_changed=1" vcml-mmu-checkpoint-v20-python.log
          grep -F "permission_change_digest_changed=1" vcml-mmu-checkpoint-v20-python.log
          grep -F "fault_context_change_digest_changed=1" vcml-mmu-checkpoint-v20-python.log
          grep -F "mixed_memory_view_rejected=1" vcml-mmu-checkpoint-v20-python.log
      - name: Regress v0.19 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v19 \
            rtl/capu_delegated_nested_trap_v19.sv \
            rtl/tb/capu_delegated_nested_trap_v19_tb.sv
          vvp /tmp/capu-v19 | tee vcml-delegated-nested-trap-v19-regression.log
          grep -F "CAPU_VCML_DELEGATED_NESTED_TRAP_V19_PASS" vcml-delegated-nested-trap-v19-regression.log
          python3 tests/test_vcml_nested_trap_checkpoint_v19.py | tee vcml-nested-trap-checkpoint-v19-python-regression.log
          grep -F "VCML_NESTED_TRAP_CHECKPOINT_V19_PASS" vcml-nested-trap-checkpoint-v19-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum \
            rtl/capu_mmu_translation_recovery_v20.sv \
            rtl/tb/capu_mmu_translation_recovery_v20_tb.sv \
            tools/vcml_mmu_checkpoint_v20.py \
            tests/test_vcml_mmu_checkpoint_v20.py \
            vcml-mmu-translation-v20.log \
            vcml-mmu-checkpoint-v20-python.log \
            vcml-delegated-nested-trap-v19-regression.log \
            vcml-nested-trap-checkpoint-v19-python-regression.log > vcml-mmu-translation-v20.sha256
          cat vcml-mmu-translation-v20.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v20-mmu-translation-evidence
          path: |
            vcml-mmu-translation-v20.log
            vcml-mmu-checkpoint-v20-python.log
            vcml-delegated-nested-trap-v19-regression.log
            vcml-nested-trap-checkpoint-v19-python-regression.log
            vcml-mmu-translation-v20.sha256

  mmu-formal:
    name: Bounded v0.20 memory-view recovery proof
    needs: mmu-rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.20 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v20-formal
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-v20-formal/safety-work \
            formal/capu_mmu_translation_recovery_v20.sby 2>&1 | tee target/capu-v20-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v20-formal/formal.log
          ! grep -q 'DONE (ERROR' target/capu-v20-formal/formal.log
      - name: Prove v0.20 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-v20-formal/cover-work \
            formal/capu_mmu_translation_recovery_v20_cover.sby 2>&1 | tee target/capu-v20-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v20-formal/cover.log
          ! grep -q 'DONE (ERROR' target/capu-v20-formal/cover.log
          test "$(find target/capu-v20-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.19 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f \
            -d target/capu-v20-formal/v19-safety-work \
            formal/capu_delegated_nested_trap_v19.sby 2>&1 | tee target/capu-v20-formal/v19-formal.log
          grep -q 'DONE (PASS' target/capu-v20-formal/v19-formal.log
          ! grep -q 'DONE (ERROR' target/capu-v20-formal/v19-formal.log
      - name: Seal v0.20 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v20-formal')
          safety=(root/'formal.log').read_text(errors='replace')
          cover=(root/'cover.log').read_text(errors='replace')
          v19=(root/'v19-formal.log').read_text(errors='replace')
          for label,log in [('v0.20 safety',safety),('v0.20 cover',cover),('v0.19 safety regression',v19)]:
              if 'DONE (PASS' not in log or 'DONE (ERROR' in log: raise SystemExit(label+' not PASS')
          inputs=[Path(x) for x in ['rtl/capu_mmu_translation_recovery_v20.sv','formal/capu_mmu_translation_recovery_v20_formal.sv','formal/capu_mmu_translation_recovery_v20.sby','formal/capu_mmu_translation_recovery_v20_cover.sby','tools/vcml_mmu_checkpoint_v20.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          witnesses=list((root/'cover-work').rglob('trace*.vcd'))
          proof={
            'schema':'capu.hardware.mmu-translation-recovery-formal-proof.v0.20',
            'result':'PASS','depth':30,'cover_depth':36,'cover_witnesses':len(witnesses),
            'solver':'z3','v0_19_safety_regression':'PASS',
            'invariants':['RESTORE_ACCEPT => EXACT_BOUND_MEMORY_VIEW','FOREIGN_OR_STALE_MEMORY_VIEW => RESTORE_REJECT','TRANSLATION_HIT => EXACT_PPN_PLUS_OFFSET','PAGE_FAULT => NO_VISIBLE_EFFECT','PAGE_FAULT => SPECULATION_KILL','RECOVERY_OR_RESTORE => NO_VISIBLE_EFFECT','PREPARE_ACCEPT => EXACT_COMMITTED_MEMORY_VIEW'],
            'claim_boundary':'bounded reduced-width one-entry translation/page-fault recovery model; no full page-table walk, TLB, shootdown, virtualization, cache/coherence, multicore, RTL SHA-256, durable media or unbounded correctness',
            'formal_input_sha256':h.hexdigest(),
            'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),
            'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),
            'v0_19_regression_log_sha256':hashlib.sha256(v19.encode()).hexdigest(),
            'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),
            'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),
            'z3_version':subprocess.check_output(['z3','--version'],text=True).strip()}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v20-mmu-translation-formal-evidence
          path: |
            target/capu-v20-formal/formal.log
            target/capu-v20-formal/cover.log
            target/capu-v20-formal/v19-formal.log
            target/capu-v20-formal/formal-proof.json
            target/capu-v20-formal/safety-work/
            target/capu-v20-formal/cover-work/
          if-no-files-found: warn
