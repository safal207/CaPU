name: CaPU vCML Queue-Epoch Slot Reuse v0.32

on:
  pull_request:
    paths:
      - 'rtl/capu_queue_epoch_slot_reuse_v32.sv'
      - 'rtl/tb/capu_queue_epoch_slot_reuse_v32_tb.sv'
      - 'tools/vcml_queue_epoch_slot_checkpoint_v32.py'
      - 'tests/test_vcml_queue_epoch_slot_checkpoint_v32.py'
      - 'formal/capu_queue_epoch_slot_reuse_v32*'
      - '.github/workflows/vcml-queue-epoch-slot-reuse-v32.yml'
      - 'docs/hardware/CAPU_VCML_QUEUE_EPOCH_SLOT_REUSE_V32.md'

jobs:
  deterministic:
    name: Queue-epoch slot reuse deterministic trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.32
        run: iverilog -g2012 -o /tmp/capu-v32 rtl/capu_queue_epoch_slot_reuse_v32.sv rtl/tb/capu_queue_epoch_slot_reuse_v32_tb.sv
      - name: Run deterministic v0.32 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v32 | tee vcml-queue-epoch-slot-v32.log
          grep -F 'CAPU_VCML_QUEUE_EPOCH_SLOT_REUSE_V32_PASS' vcml-queue-epoch-slot-v32.log
          grep -F 'epoch2_checkpoint pending=1 epoch=2 state=UNISSUED' vcml-queue-epoch-slot-v32.log
          grep -F 'epoch3_reuse same_numeric_ids=1 queue_epoch_discriminator=1 durable_epoch=3' vcml-queue-epoch-slot-v32.log
          grep -F 'late_epoch2_evidence quarantined=1 epoch3_state=UNKNOWN no_authority_mutation=1' vcml-queue-epoch-slot-v32.log
          grep -F 'stale_epoch2_restore epoch3_slot_wins=1 current_epoch=3 unknown_preserved=1' vcml-queue-epoch-slot-v32.log
          grep -F 'epoch_namespace_exhausted last_retired=15 wrap_to_0_blocked=1 fail_closed=1' vcml-queue-epoch-slot-v32.log
      - name: Run canonical v0.32 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_queue_epoch_slot_checkpoint_v32.py | tee vcml-queue-epoch-slot-checkpoint-v32-python.log
          grep -F 'VCML_QUEUE_EPOCH_SLOT_CHECKPOINT_V32_PASS' vcml-queue-epoch-slot-checkpoint-v32-python.log
          grep -F 'same_epoch_slot_reuse_rejected=1' vcml-queue-epoch-slot-checkpoint-v32-python.log
          grep -F 'skipped_epoch_slot_reuse_rejected=1' vcml-queue-epoch-slot-checkpoint-v32-python.log
          grep -F 'unknown_without_issue_receipt_rejected=1' vcml-queue-epoch-slot-checkpoint-v32-python.log
          grep -F 'committed_without_completion_receipt_rejected=1' vcml-queue-epoch-slot-checkpoint-v32-python.log
          grep -F 'future_checkpoint_epoch_rejected=1' vcml-queue-epoch-slot-checkpoint-v32-python.log
          grep -F 'stale_checkpoint_predates_reused_slot_preserved=1' vcml-queue-epoch-slot-checkpoint-v32-python.log
      - name: Regress v0.31 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v31 rtl/capu_concurrent_dma_queue_recovery_v31.sv rtl/tb/capu_concurrent_dma_queue_recovery_v31_tb.sv
          vvp /tmp/capu-v31 | tee vcml-concurrent-dma-queue-v31-regression.log
          grep -F 'CAPU_VCML_CONCURRENT_DMA_QUEUE_RECOVERY_V31_PASS' vcml-concurrent-dma-queue-v31-regression.log
          python3 tests/test_vcml_concurrent_dma_queue_checkpoint_v31.py | tee vcml-concurrent-dma-queue-checkpoint-v31-python-regression.log
          grep -F 'VCML_CONCURRENT_DMA_QUEUE_CHECKPOINT_V31_PASS' vcml-concurrent-dma-queue-checkpoint-v31-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_queue_epoch_slot_reuse_v32.sv rtl/tb/capu_queue_epoch_slot_reuse_v32_tb.sv tools/vcml_queue_epoch_slot_checkpoint_v32.py tests/test_vcml_queue_epoch_slot_checkpoint_v32.py vcml-queue-epoch-slot-v32.log vcml-queue-epoch-slot-checkpoint-v32-python.log vcml-concurrent-dma-queue-v31-regression.log vcml-concurrent-dma-queue-checkpoint-v31-python-regression.log > vcml-queue-epoch-slot-v32.sha256
          cat vcml-queue-epoch-slot-v32.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v32-queue-epoch-slot-evidence
          path: |
            vcml-queue-epoch-slot-v32.log
            vcml-queue-epoch-slot-checkpoint-v32-python.log
            vcml-concurrent-dma-queue-v31-regression.log
            vcml-concurrent-dma-queue-checkpoint-v31-python-regression.log
            vcml-queue-epoch-slot-v32.sha256

  formal:
    name: Bounded v0.32 queue-epoch slot-reuse proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.32 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v32-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v32-formal/safety-work formal/capu_queue_epoch_slot_reuse_v32.sby 2>&1 | tee target/capu-v32-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v32-formal/formal.log
      - name: Prove v0.32 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v32-formal/cover-work formal/capu_queue_epoch_slot_reuse_v32_cover.sby 2>&1 | tee target/capu-v32-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v32-formal/cover.log
          test "$(find target/capu-v32-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.31 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v32-formal/v31-safety-work formal/capu_concurrent_dma_queue_recovery_v31.sby 2>&1 | tee target/capu-v32-formal/v31-formal.log
          grep -q 'DONE (PASS' target/capu-v32-formal/v31-formal.log
      - name: Seal v0.32 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v32-formal')
          safety=(root/'formal.log').read_text(errors='replace'); cover=(root/'cover.log').read_text(errors='replace'); v31=(root/'v31-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_queue_epoch_slot_reuse_v32.sv','formal/capu_queue_epoch_slot_reuse_v32_formal.sv','formal/capu_queue_epoch_slot_reuse_v32.sby','formal/capu_queue_epoch_slot_reuse_v32_cover.sby','tools/vcml_queue_epoch_slot_checkpoint_v32.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.queue-epoch-slot-reuse-formal-proof.v0.32','result':'PASS','proof_method':'bounded model checking','depth':14,'cover_depth':28,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'formal_identity_width_bits':2,'slot_count':1,'exact_successor_epoch_reuse':True,'epoch_wrap_policy':'fail-closed','v0_31_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_31_regression_log_sha256':hashlib.sha256(v31.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width one-slot lifecycle model with exact-successor queue-epoch reuse, stale prior-epoch evidence rejection, stale-checkpoint dominance by current durable slot identity and fail-closed queue-epoch exhaustion'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v32-queue-epoch-slot-formal-evidence
          path: |
            target/capu-v32-formal/formal.log
            target/capu-v32-formal/cover.log
            target/capu-v32-formal/v31-formal.log
            target/capu-v32-formal/formal-proof.json
            target/capu-v32-formal/safety-work/
            target/capu-v32-formal/cover-work/
