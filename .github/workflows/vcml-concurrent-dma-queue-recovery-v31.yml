name: CaPU vCML Concurrent DMA Queue Recovery v0.31

on:
  pull_request:
    paths:
      - 'rtl/capu_concurrent_dma_queue_recovery_v31.sv'
      - 'rtl/tb/capu_concurrent_dma_queue_recovery_v31_tb.sv'
      - 'tools/vcml_concurrent_dma_queue_checkpoint_v31.py'
      - 'tests/test_vcml_concurrent_dma_queue_checkpoint_v31.py'
      - 'formal/capu_concurrent_dma_queue_recovery_v31*'
      - '.github/workflows/vcml-concurrent-dma-queue-recovery-v31.yml'
      - 'docs/hardware/CAPU_VCML_CONCURRENT_DMA_QUEUE_RECOVERY_V31.md'

jobs:
  deterministic:
    name: Concurrent DMA queue deterministic trajectory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile v0.31
        run: iverilog -g2012 -o /tmp/capu-v31 rtl/capu_concurrent_dma_queue_recovery_v31.sv rtl/tb/capu_concurrent_dma_queue_recovery_v31_tb.sv
      - name: Run deterministic v0.31 trajectory
        run: |
          set -euo pipefail
          vvp /tmp/capu-v31 | tee vcml-concurrent-dma-queue-v31.log
          grep -F 'CAPU_VCML_CONCURRENT_DMA_QUEUE_RECOVERY_V31_PASS' vcml-concurrent-dma-queue-v31.log
          grep -F 'younger_nonoverlap_commit tx1_f0=COMMITTED older_tx0_f0=UNKNOWN lane3_owner=TX1_F0 concurrent_safe=1' vcml-concurrent-dma-queue-v31.log
          grep -F 'younger_overlap_blocked tx1_f1=1 older_overlap_unresolved=1 no_issue_authority=1' vcml-concurrent-dma-queue-v31.log
          grep -F 'queue_restore exact_tx_slots=1 younger_nonoverlap_commit_preserved=1 overlap_unknown_preserved=1 owner_provenance_preserved=1' vcml-concurrent-dma-queue-v31.log
          grep -F 'younger_retire_before_older rejected=1 queue_order_preserved=1' vcml-concurrent-dma-queue-v31.log
          grep -F 'ordered_retire tx0_then_tx1=1 retired_bitmap=11' vcml-concurrent-dma-queue-v31.log
      - name: Run canonical v0.31 SHA-256 tests
        run: |
          set -euo pipefail
          python3 tests/test_vcml_concurrent_dma_queue_checkpoint_v31.py | tee vcml-concurrent-dma-queue-checkpoint-v31-python.log
          grep -F 'VCML_CONCURRENT_DMA_QUEUE_CHECKPOINT_V31_PASS' vcml-concurrent-dma-queue-checkpoint-v31-python.log
          grep -F 'transaction_slot_swap_digest_changed=1' vcml-concurrent-dma-queue-checkpoint-v31-python.log
          grep -F 'younger_retired_before_older_rejected=1' vcml-concurrent-dma-queue-checkpoint-v31-python.log
          grep -F 'owner_without_fragment_commit_rejected=1' vcml-concurrent-dma-queue-checkpoint-v31-python.log
          grep -F 'younger_overlap_without_older_completion_rejected=1' vcml-concurrent-dma-queue-checkpoint-v31-python.log
      - name: Regress v0.30 deterministic and canonical paths
        run: |
          set -euo pipefail
          iverilog -g2012 -o /tmp/capu-v30 rtl/capu_overlapping_dma_fragment_recovery_v30.sv rtl/tb/capu_overlapping_dma_fragment_recovery_v30_tb.sv
          vvp /tmp/capu-v30 | tee vcml-overlapping-dma-v30-regression.log
          grep -F 'CAPU_VCML_OVERLAPPING_DMA_FRAGMENT_RECOVERY_V30_PASS' vcml-overlapping-dma-v30-regression.log
          python3 tests/test_vcml_overlapping_dma_checkpoint_v30.py | tee vcml-overlapping-dma-checkpoint-v30-python-regression.log
          grep -F 'VCML_OVERLAPPING_DMA_CHECKPOINT_V30_PASS' vcml-overlapping-dma-checkpoint-v30-python-regression.log
      - name: Seal executable evidence
        run: |
          sha256sum rtl/capu_concurrent_dma_queue_recovery_v31.sv rtl/tb/capu_concurrent_dma_queue_recovery_v31_tb.sv tools/vcml_concurrent_dma_queue_checkpoint_v31.py tests/test_vcml_concurrent_dma_queue_checkpoint_v31.py vcml-concurrent-dma-queue-v31.log vcml-concurrent-dma-queue-checkpoint-v31-python.log vcml-overlapping-dma-v30-regression.log vcml-overlapping-dma-checkpoint-v30-python-regression.log > vcml-concurrent-dma-queue-v31.sha256
          cat vcml-concurrent-dma-queue-v31.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v31-concurrent-dma-queue-evidence
          path: |
            vcml-concurrent-dma-queue-v31.log
            vcml-concurrent-dma-queue-checkpoint-v31-python.log
            vcml-overlapping-dma-v30-regression.log
            vcml-overlapping-dma-checkpoint-v30-python-regression.log
            vcml-concurrent-dma-queue-v31.sha256

  formal:
    name: Bounded v0.31 concurrent DMA queue proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 git
          yosys -V
          z3 --version
      - name: Install pinned SBY
        run: |
          set -euo pipefail
          SBY_SHA='b1a1e98cba941ec8433f8dc27f416cd7bb7f14be'
          git init /tmp/sby
          git -C /tmp/sby remote add origin https://github.com/YosysHQ/sby.git
          git -C /tmp/sby fetch --depth 1 origin "$SBY_SHA"
          git -C /tmp/sby checkout --detach FETCH_HEAD
          test "$(git -C /tmp/sby rev-parse HEAD)" = "$SBY_SHA"
          printf '%s\n' "$SBY_SHA" > /tmp/sby-sha.txt
      - name: Prove bounded v0.31 safety
        run: |
          set -euo pipefail
          mkdir -p target/capu-v31-formal
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v31-formal/safety-work formal/capu_concurrent_dma_queue_recovery_v31.sby 2>&1 | tee target/capu-v31-formal/formal.log
          grep -q 'DONE (PASS' target/capu-v31-formal/formal.log
      - name: Prove v0.31 paths reachable
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v31-formal/cover-work formal/capu_concurrent_dma_queue_recovery_v31_cover.sby 2>&1 | tee target/capu-v31-formal/cover.log
          grep -q 'DONE (PASS' target/capu-v31-formal/cover.log
          test "$(find target/capu-v31-formal/cover-work -name 'trace*.vcd' | wc -l)" -ge 1
      - name: Regress v0.30 bounded safety
        run: |
          set -euo pipefail
          python3 /tmp/sby/sbysrc/sby.py -f -d target/capu-v31-formal/v30-safety-work formal/capu_overlapping_dma_fragment_recovery_v30.sby 2>&1 | tee target/capu-v31-formal/v30-formal.log
          grep -q 'DONE (PASS' target/capu-v31-formal/v30-formal.log
      - name: Seal v0.31 formal evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('target/capu-v31-formal')
          safety=(root/'formal.log').read_text(errors='replace'); cover=(root/'cover.log').read_text(errors='replace'); v30=(root/'v30-formal.log').read_text(errors='replace')
          inputs=[Path(x) for x in ['rtl/capu_concurrent_dma_queue_recovery_v31.sv','formal/capu_concurrent_dma_queue_recovery_v31_formal.sv','formal/capu_concurrent_dma_queue_recovery_v31.sby','formal/capu_concurrent_dma_queue_recovery_v31_cover.sby','tools/vcml_concurrent_dma_queue_checkpoint_v31.py']]
          h=hashlib.sha256()
          for p in inputs: h.update(str(p).encode()+b'\0'+p.read_bytes()+b'\0')
          proof={'schema':'capu.hardware.concurrent-dma-queue-recovery-formal-proof.v0.31','result':'PASS','proof_method':'bounded model checking','depth':12,'cover_depth':24,'cover_witnesses':len(list((root/'cover-work').rglob('trace*.vcd'))),'formal_identity_width_bits':2,'transaction_count':2,'fragments_per_transaction':2,'byte_lane_count':4,'v0_30_safety_regression':'PASS','formal_input_sha256':h.hexdigest(),'formal_log_sha256':hashlib.sha256(safety.encode()).hexdigest(),'cover_log_sha256':hashlib.sha256(cover.encode()).hexdigest(),'v0_30_regression_log_sha256':hashlib.sha256(v30.encode()).hexdigest(),'sby_git_sha':Path('/tmp/sby-sha.txt').read_text().strip(),'yosys_version':subprocess.check_output(['yosys','-V'],text=True).strip(),'z3_version':subprocess.check_output(['z3','--version'],text=True).strip(),'claim_boundary':'bounded reduced-width two-transaction one-queue-epoch model with two fragments per transaction, fixed overlap, overlap-aware younger issue authority, durable visible-owner provenance and ordered retirement'}
          (root/'formal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capu-vcml-v31-concurrent-dma-queue-formal-evidence
          path: |
            target/capu-v31-formal/formal.log
            target/capu-v31-formal/cover.log
            target/capu-v31-formal/v30-formal.log
            target/capu-v31-formal/formal-proof.json
            target/capu-v31-formal/safety-work/
            target/capu-v31-formal/cover-work/
